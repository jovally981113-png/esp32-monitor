
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>智慧微藻遮陽換氣系統</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #0a7a6a;
    --dark: #065a4e;
    --light: #e8f6f2;
    --muted: #5f7f78;
    --border: #dcece7;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    background: var(--light);
    color: #1a3d37;
}

/* =====================================
   整體畫面
===================================== */

.dashboard {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =====================================
   頂部
===================================== */

header {
    background: linear-gradient(
        135deg,
        var(--dark),
        var(--primary)
    );

    color: white;
    padding: 12px 24px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    flex-shrink: 0;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 4px;
    font-size: 13px;
    color: #c4e8e0;
}

.system-status {
    background: #ffffff20;
    padding: 8px 15px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 13px;
    white-space: nowrap;
}

/* =====================================
   主畫面
===================================== */

main {
    flex: 1;
    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(175px, 18%);

    gap: 10px;
    padding: 10px;
}

/* =====================================
   中間主要區域
===================================== */

.center-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    min-width: 0;
}

.section-title {
    font-size: 17px;
    font-weight: bold;
    color: var(--primary);
    flex-shrink: 0;
}

/* =====================================
   五個即時數據
===================================== */

.sensor-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
    flex-shrink: 0;
}

.sensor-card {
    background: white;
    border-radius: 13px;
    border-left: 4px solid #1fb3a0;
    box-shadow: 0 4px 15px #00463c12;

    padding: 9px 5px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    min-width: 0;
}

.sensor-icon {
    font-size: 23px;
}

.sensor-name {
    font-size: 13px;
    color: var(--muted);
    margin: 3px 0;
}

.sensor-value {
    font-size: clamp(18px, 2.5vw, 29px);
    font-weight: bold;
    color: var(--primary);
    white-space: nowrap;
}

.sensor-value small {
    font-size: 12px;
    font-weight: normal;
    color: #8ba9a3;
}

/* =====================================
   圖表選擇區
===================================== */

.chart-selector {
    background: white;
    border-radius: 13px;
    padding: 10px 12px;
    box-shadow: 0 4px 15px #00463c12;
    flex-shrink: 0;
}

.selector-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
}

.selector-title {
    font-size: 14px;
    font-weight: bold;
    color: #24564f;
}

.selector-actions {
    display: flex;
    gap: 5px;
}

.small-btn {
    border: none;
    border-radius: 12px;
    padding: 5px 9px;
    font-size: 11px;
    background: #eaf5f2;
    color: #24564f;
    cursor: pointer;
}

.small-btn:hover {
    background: #d1eee6;
}

.chart-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.chart-option {
    display: inline-flex;
    align-items: center;
    gap: 5px;

    padding: 6px 9px;

    border-radius: 18px;
    border: 1px solid var(--border);

    background: #f7fbfa;
    color: #416c64;

    font-size: 12px;
    cursor: pointer;
    user-select: none;
}

.chart-option:has(input:checked) {
    background: #dff5ee;
    border-color: #55bda8;
    color: #087465;
    font-weight: bold;
}

.chart-option input {
    accent-color: var(--primary);
    cursor: pointer;
}

/* =====================================
   動態圖表區
===================================== */

.chart-grid {
    flex: 1;
    min-height: 0;
    min-width: 0;

    display: grid;
    gap: 10px;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    grid-auto-rows: minmax(0, 1fr);
}

/* 一張圖 */
.chart-grid[data-count="1"] {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
}

/* 兩張圖 */
.chart-grid[data-count="2"] {
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
}

/* 三張圖：第三張佔整排 */
.chart-grid[data-count="3"] {
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    grid-template-rows:
        repeat(2, minmax(0, 1fr));
}

.chart-grid[data-count="3"]
.chart-card:last-child {
    grid-column: span 2;
}

/* 四張圖 */
.chart-grid[data-count="4"] {
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    grid-template-rows:
        repeat(2, minmax(0, 1fr));
}

/* 五、六張圖 */
.chart-grid[data-count="5"],
.chart-grid[data-count="6"] {
    grid-template-columns:
        repeat(3, minmax(0, 1fr));
    grid-template-rows:
        repeat(2, minmax(0, 1fr));
}

/* 五張時最後一張橫向放大 */
.chart-grid[data-count="5"]
.chart-card:last-child {
    grid-column: span 2;
}

/* 圖表卡片 */

.chart-card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00463c12;

    padding: 10px;

    display: flex;
    flex-direction: column;

    min-height: 0;
    min-width: 0;
    overflow: hidden;
}

.chart-title {
    font-size: 14px;
    font-weight: bold;
    color: #1a4d44;
    margin-bottom: 5px;

    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;

    flex-shrink: 0;
}

.chart-title span {
    font-size: 10px;
    font-weight: normal;
    color: var(--muted);
    background: var(--light);
    padding: 3px 8px;
    border-radius: 12px;
}

.chart-container {
    flex: 1;
    min-height: 0;
    min-width: 0;
    position: relative;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

/* 沒有選圖表 */

.empty-charts {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;

    background: white;
    border-radius: 14px;

    color: #7a9d95;
    font-size: 15px;
    text-align: center;
    padding: 20px;
}

/* =====================================
   右側統計
===================================== */

.right-panel {
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px #00463c12;

    padding: 10px;

    display: flex;
    flex-direction: column;

    min-height: 0;
    min-width: 0;
    overflow: hidden;
}

.panel-title {
    color: var(--primary);
    font-size: 18px;
    font-weight: bold;
}

#statRangeLabel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}

.controls {
    margin: 10px 0 5px;
    flex-shrink: 0;
}

.controls-row {
    margin-bottom: 9px;
}

.controls-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.btn-group button {
    border: 0;
    border-radius: 16px;
    background: #eaf5f2;
    color: #24564f;

    padding: 6px 9px;
    font-size: 12px;

    cursor: pointer;
}

.btn-group button.active {
    background: var(--primary);
    color: white;
}

#statsContainer {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
    justify-content: space-around;
}

.stat-section {
    border-top: 1px solid #e6f0ed;
    padding: 5px 0;
}

.stat-name {
    color: #24564f;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 3px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    gap: 5px;

    font-size: 12px;
    color: #66837d;
    padding: 2px 0;
}

.stat-value {
    font-weight: bold;
    color: var(--primary);
    white-space: nowrap;
}

/* =====================================
   底部
===================================== */

footer {
    text-align: center;
    padding: 5px;
    color: #8aa8a0;
    font-size: 11px;
    flex-shrink: 0;
}

/* =====================================
   較矮螢幕
===================================== */

@media (max-height: 760px) {
    header {
        padding: 8px 18px;
    }

    header h1 {
        font-size: 21px;
    }

    main {
        gap: 8px;
        padding: 8px;
    }

    .center-panel {
        gap: 7px;
    }

    .sensor-card {
        padding: 4px;
    }

    .sensor-icon {
        font-size: 18px;
    }

    .sensor-value {
        font-size: 21px;
    }

    .chart-selector {
        padding: 7px;
    }

    .chart-option {
        padding: 4px 7px;
        font-size: 11px;
    }

    .chart-grid {
        gap: 7px;
    }

    .chart-card {
        padding: 7px;
    }

    .stat-section {
        padding: 2px 0;
    }

    .stat-row {
        padding: 1px 0;
    }
}

/* =====================================
   平板與手機
===================================== */

@media (max-width: 950px) {
    .dashboard {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
    }

    main {
        display: flex;
        flex-direction: column;
    }

    .center-panel {
        min-height: 700px;
    }

    .chart-grid {
        min-height: 400px;
    }

    .right-panel {
        overflow: visible;
    }
}

@media (max-width: 650px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    .sensor-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .sensor-card {
        min-height: 90px;
    }

    .chart-grid,
    .chart-grid[data-count] {
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .chart-card {
        flex: none;
        height: 250px;
    }
}
</style>
</head>

<body>

<div class="dashboard">

<header>
    <div>
        <h1>🌿 智慧微藻遮陽換氣系統</h1>
        <p>
            Smart Microalgae Shading · 即時環境監控
        </p>
    </div>

    <div class="system-status">
        🟢 狀態：
        <span id="status">連線中...</span>
        <div>
            🕒 更新：
            <span id="updateTime">--</span>
        </div>
    </div>
</header>

<main>

<!-- ================================
     中間主要區域
================================ -->

<section class="center-panel">

    <div class="section-title">
        📡 即時環境監測
    </div>

    <!-- 五個即時數據 -->

    <div class="sensor-grid">

        <div class="sensor-card">
            <div class="sensor-icon">🌡️</div>
            <div class="sensor-name">水溫</div>
            <div class="sensor-value">
                <span id="temperature">--</span>
                <small>°C</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="sensor-icon">💧</div>
            <div class="sensor-name">濕度</div>
            <div class="sensor-value">
                <span id="humidity">--</span>
                <small>%</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="sensor-icon">🏠</div>
            <div class="sensor-name">室內 CO₂</div>
            <div class="sensor-value">
                <span id="co2Indoor">--</span>
                <small>ppm</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="sensor-icon">🌳</div>
            <div class="sensor-name">室外 CO₂</div>
            <div class="sensor-value">
                <span id="co2Outdoor">--</span>
                <small>ppm</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="sensor-icon">⚡</div>
            <div class="sensor-name">電壓</div>
            <div class="sensor-value">
                <span id="voltage">--</span>
                <small>V</small>
            </div>
        </div>

    </div>

    <!-- ================================
         圖表選擇
    ================================ -->

    <div class="chart-selector">

        <div class="selector-header">
            <div class="selector-title">
                📈 自訂圖表顯示
            </div>

            <div class="selector-actions">
                <button
                    class="small-btn"
                    onclick="selectAllCharts()"
                >
                    全選
                </button>

                <button
                    class="small-btn"
                    onclick="clearAllCharts()"
                >
                    清除
                </button>
            </div>
        </div>

        <div class="chart-options">

            <label class="chart-option">
                <input
                    type="checkbox"
                    value="temperature"
                    checked
                    onchange="updateSelectedCharts()"
                >
                🌡️ 水溫
            </label>

            <label class="chart-option">
                <input
                    type="checkbox"
                    value="humidity"
                    checked
                    onchange="updateSelectedCharts()"
                >
                💧 濕度
            </label>

            <label class="chart-option">
                <input
                    type="checkbox"
                    value="co2Indoor"
                    onchange="updateSelectedCharts()"
                >
                🏠 室內 CO₂
            </label>

            <label class="chart-option">
                <input
                    type="checkbox"
                    value="co2Outdoor"
                    onchange="updateSelectedCharts()"
                >
                🌳 室外 CO₂
            </label>

            <label class="chart-option">
                <input
                    type="checkbox"
                    value="voltage"
                    onchange="updateSelectedCharts()"
                >
                ⚡ 電壓
            </label>

            <label class="chart-option">
                <input
                    type="checkbox"
                    value="co2Compare"
                    checked
                    onchange="updateSelectedCharts()"
                >
                🌫️ 室內＋室外 CO₂ 比較
            </label>

        </div>

    </div>

    <!-- 動態產生圖表 -->

    <div
        class="chart-grid"
        id="chartGrid"
        data-count="3"
    ></div>

</section>

<!-- ================================
     右側統計
================================ -->

<aside class="right-panel">

    <div class="panel-title">
        📊 數據統計
    </div>

    <div id="statRangeLabel">
        (最近 10 分鐘)
    </div>

    <div class="controls">

        <div class="controls-row">
            <span class="controls-label">
                📈 圖表筆數
            </span>

            <div
                class="btn-group"
                id="chartBtnGroup"
            >
                <button
                    class="active"
                    onclick="changeChartCount(10)"
                >10筆</button>

                <button
                    onclick="changeChartCount(20)"
                >20筆</button>

                <button
                    onclick="changeChartCount(50)"
                >50筆</button>

                <button
                    onclick="changeChartCount(0)"
                >全部</button>
            </div>
        </div>

        <div class="controls-row">
            <span class="controls-label">
                ⏱ 統計時間
            </span>

            <div
                class="btn-group"
                id="statBtnGroup"
            >
                <button
                    class="active"
                    onclick="changeStatRange(10)"
                >10min</button>

                <button
                    onclick="changeStatRange(30)"
                >30min</button>

                <button
                    onclick="changeStatRange(60)"
                >60min</button>
            </div>
        </div>

    </div>

    <div id="statsContainer"></div>

</aside>

</main>

<footer>
    隊伍編號:大專-創-N075
</footer>

</div>

<script>
"use strict";

// ==========================================
// ThingSpeak 設定
// ==========================================

const CHANNEL_ID = "3474112";
const READ_API_KEY = "IT0OTL4TT1QFKXO8";
const TIMEZONE = "Asia/Taipei";

// Field 1：水溫
// Field 2：濕度
// Field 3：停用
// Field 4：室內 CO2
// Field 5：室外 CO2
// Field 6：電壓

const FIELD_MAP = {
    temperature: "field1",
    humidity: "field2",
    co2Indoor: "field4",
    co2Outdoor: "field5",
    voltage: "field6"
};

// ==========================================
// 圖表設定
// ==========================================

const CHART_CONFIG = {

    temperature: {
        title: "🌡️ 水溫",
        unit: "°C",
        datasets: [
            {
                label: "水溫",
                field: "field1",
                color: "#e74c3c"
            }
        ]
    },

    humidity: {
        title: "💧 濕度",
        unit: "%",
        datasets: [
            {
                label: "濕度",
                field: "field2",
                color: "#3498db"
            }
        ]
    },

    co2Indoor: {
        title: "🏠 室內 CO₂",
        unit: "ppm",
        datasets: [
            {
                label: "室內 CO₂",
                field: "field4",
                color: "#e76f51"
            }
        ]
    },

    co2Outdoor: {
        title: "🌳 室外 CO₂",
        unit: "ppm",
        datasets: [
            {
                label: "室外 CO₂",
                field: "field5",
                color: "#3498db"
            }
        ]
    },

    voltage: {
        title: "⚡ 電壓",
        unit: "V",
        datasets: [
            {
                label: "電壓",
                field: "field6",
                color: "#e5a000"
            }
        ]
    },

    co2Compare: {
        title: "🌫️ 室內與室外 CO₂ 濃度比較",
        unit: "ppm",
        datasets: [
            {
                label: "室內 CO₂",
                field: "field4",
                color: "#e76f51"
            },
            {
                label: "室外 CO₂",
                field: "field5",
                color: "#3498db"
            }
        ]
    }

};

// ==========================================
// 全域變數
// ==========================================

let chartCount = 10;
let statMinutes = 10;

let charts = {};
let loading = false;

let allFeedsCache = [];
let latestFeedCache = null;

let selectedCharts = [
    "temperature",
    "humidity",
    "co2Compare"
];

const $ = id => document.getElementById(id);

// ==========================================
// 時間格式
// ==========================================

function formatTime(date, full = false) {

    const options = {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    };

    if (full) {
        options.year = "numeric";
        options.month = "2-digit";
        options.day = "2-digit";
    }

    return new Intl.DateTimeFormat(
        "zh-TW",
        options
    ).format(date);
}

// ==========================================
// 數值處理
// ==========================================

function parseValue(value) {

    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : null;
}

function setValue(id, value, decimals) {

    $(id).textContent =
        value === null
            ? "--"
            : value.toFixed(decimals);
}

function co2Color(value) {

    if (value === null) {
        return "#0a7a6a";
    }

    if (value >= 1500) {
        return "#dc2626";
    }

    if (value >= 1000) {
        return "#f97316";
    }

    return "#087f6f";
}

// ==========================================
// 取得勾選圖表
// ==========================================

function getSelectedCharts() {

    return Array.from(
        document.querySelectorAll(
            '.chart-options input:checked'
        )
    ).map(input => input.value);
}

// ==========================================
// 更新選擇的圖表
// ==========================================

window.updateSelectedCharts = function() {

    selectedCharts = getSelectedCharts();

    buildChartCards();

    renderCharts();

};

// ==========================================
// 全選圖表
// ==========================================

window.selectAllCharts = function() {

    document.querySelectorAll(
        ".chart-options input"
    ).forEach(input => {
        input.checked = true;
    });

    updateSelectedCharts();
};

// ==========================================
// 清除圖表
// ==========================================

window.clearAllCharts = function() {

    document.querySelectorAll(
        ".chart-options input"
    ).forEach(input => {
        input.checked = false;
    });

    updateSelectedCharts();
};

// ==========================================
// 建立圖表卡片
// ==========================================

function buildChartCards() {

    // 先銷毀舊圖表
    Object.values(charts).forEach(chart => {
        if (chart) {
            chart.destroy();
        }
    });

    charts = {};

    const grid = $("chartGrid");

    grid.innerHTML = "";

    grid.dataset.count =
        selectedCharts.length;

    if (!selectedCharts.length) {

        grid.innerHTML = `
            <div class="empty-charts">
                請在上方勾選想顯示的圖表
            </div>
        `;

        return;
    }

    selectedCharts.forEach(key => {

        const config = CHART_CONFIG[key];

        const card = document.createElement("div");

        card.className = "chart-card";

        const title = document.createElement("div");
        title.className = "chart-title";

        const titleText = document.createElement("div");
        titleText.textContent = config.title;

        const countLabel = document.createElement("span");
        countLabel.className = "count-label";
        countLabel.textContent =
            chartCount === 0
                ? "全部"
                : chartCount + "筆";

        title.appendChild(titleText);
        title.appendChild(countLabel);

        const container = document.createElement("div");
        container.className = "chart-container";

        const canvas = document.createElement("canvas");
        canvas.id = "chart_" + key;

        container.appendChild(canvas);

        card.appendChild(title);
        card.appendChild(container);

        grid.appendChild(card);

    });

}

// ==========================================
// 切換圖表筆數
// ==========================================

window.changeChartCount = function(count) {

    chartCount = count;

    document.querySelectorAll(
        "#chartBtnGroup button"
    ).forEach(button => {

        button.classList.toggle(
            "active",
            button.textContent ===
            (
                count === 0
                    ? "全部"
                    : count + "筆"
            )
        );

    });

    document.querySelectorAll(
        ".count-label"
    ).forEach(element => {

        element.textContent =
            count === 0
                ? "全部"
                : count + "筆";

    });

    renderCharts();
};

// ==========================================
// 切換統計時間
// ==========================================

window.changeStatRange = function(minutes) {

    statMinutes = minutes;

    document.querySelectorAll(
        "#statBtnGroup button"
    ).forEach(button => {

        button.classList.toggle(
            "active",
            button.textContent === minutes + "min"
        );

    });

    $("statRangeLabel").textContent =
        `(最近 ${minutes} 分鐘)`;

    renderStatsFromCache();
};

// ==========================================
// 取得曲線資料
// ==========================================

function getPoints(feeds, field) {

    return feeds.flatMap(feed => {

        const value = parseValue(
            feed[field]
        );

        if (value === null) {
            return [];
        }

        return [{
            x: feed.timestamp,
            y: value
        }];

    });
}

// ==========================================
// 建立 Chart.js 圖表
// ==========================================

function createChart(
    key,
    config,
    feeds,
    start,
    end
) {

    const canvas = $("chart_" + key);

    if (!canvas) {
        return;
    }

    if (charts[key]) {
        charts[key].destroy();
    }

    const datasets = config.datasets.map(item => ({

        label: item.label,

        data: getPoints(
            feeds,
            item.field
        ),

        borderColor: item.color,

        backgroundColor: item.color + "18",

        borderWidth: 2.5,

        pointRadius: feeds.length > 50 ? 0 : 3,

        pointHoverRadius: 6,

        pointBackgroundColor: item.color,

        tension: 0.25,

        fill: false,

        spanGaps: false

    }));

    charts[key] = new Chart(canvas, {

        type: "line",

        data: {
            datasets
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            animation: {
                duration: 200
            },

            interaction: {
                mode: "nearest",
                intersect: false
            },

            plugins: {

                legend: {

                    display: datasets.length > 1,

                    position: "top",

                    labels: {

                        usePointStyle: true,

                        boxWidth: 9,

                        font: {
                            size: 11
                        }

                    }

                },

                tooltip: {

                    callbacks: {

                        title: context => {

                            if (!context.length) {
                                return "";
                            }

                            return formatTime(
                                new Date(
                                    context[0].parsed.x
                                ),
                                true
                            );

                        },

                        label: context => {

                            const decimals =
                                config.unit === "ppm"
                                    ? 0
                                    : config.unit === "V"
                                        ? 2
                                        : 1;

                            return (
                                context.dataset.label +
                                ": " +
                                context.parsed.y.toFixed(
                                    decimals
                                ) +
                                " " +
                                config.unit
                            );

                        }

                    }

                }

            },

            scales: {

                x: {

                    type: "linear",

                    min: start,

                    max: end,

                    ticks: {

                        maxTicksLimit: 6,

                        font: {
                            size: 10
                        },

                        callback: value =>
                            formatTime(
                                new Date(value)
                            )

                    },

                    grid: {
                        display: false
                    }

                },

                y: {

                    beginAtZero: false,

                    ticks: {
                        font: {
                            size: 10
                        }
                    },

                    grid: {
                        color: "rgba(0,0,0,0.05)"
                    }

                }

            }

        }

    });
}

// ==========================================
// 更新所有選取的圖表
// ==========================================

function renderCharts() {

    if (!allFeedsCache.length) {
        return;
    }

    const feeds = chartCount === 0
        ? allFeedsCache
        : allFeedsCache.slice(-chartCount);

    if (!feeds.length) {
        return;
    }

    const firstTs = feeds[0].timestamp;

    const lastTs =
        feeds[feeds.length - 1].timestamp;

    const start = firstTs === lastTs
        ? firstTs - 30000
        : firstTs;

    const end = firstTs === lastTs
        ? lastTs + 30000
        : lastTs;

    selectedCharts.forEach(key => {

        createChart(
            key,
            CHART_CONFIG[key],
            feeds,
            start,
            end
        );

    });

}

// ==========================================
// 統計計算
// ==========================================

function getStats(feeds, field) {

    const values = feeds
        .map(feed => parseValue(feed[field]))
        .filter(value => value !== null);

    if (!values.length) {
        return null;
    }

    const sum = values.reduce(
        (total, value) => total + value,
        0
    );

    return {
        max: Math.max(...values),
        min: Math.min(...values),
        avg: sum / values.length
    };
}

// ==========================================
// 顯示統計
// ==========================================

function renderStats(feeds) {

    const configs = [

        {
            name: "🌡️ 水溫",
            field: FIELD_MAP.temperature,
            unit: "°C",
            decimals: 1
        },

        {
            name: "💧 濕度",
            field: FIELD_MAP.humidity,
            unit: "%",
            decimals: 1
        },

        {
            name: "🏠 室內 CO₂",
            field: FIELD_MAP.co2Indoor,
            unit: "ppm",
            decimals: 0
        },

        {
            name: "🌳 室外 CO₂",
            field: FIELD_MAP.co2Outdoor,
            unit: "ppm",
            decimals: 0
        },

        {
            name: "⚡ 電壓",
            field: FIELD_MAP.voltage,
            unit: "V",
            decimals: 2
        }

    ];

    $("statsContainer").innerHTML =
        configs.map(config => {

            const stats = getStats(
                feeds,
                config.field
            );

            function display(key) {

                if (!stats) {
                    return "--";
                }

                return (
                    stats[key].toFixed(
                        config.decimals
                    ) +
                    " " +
                    config.unit
                );

            }

            return `
                <div class="stat-section">

                    <div class="stat-name">
                        ${config.name}
                    </div>

                    <div class="stat-row">
                        <span>最高</span>
                        <span class="stat-value">
                            ${display("max")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>最低</span>
                        <span class="stat-value">
                            ${display("min")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>平均</span>
                        <span class="stat-value">
                            ${display("avg")}
                        </span>
                    </div>

                </div>
            `;

        }).join("");

}

// ==========================================
// 由快取重新計算統計
// ==========================================

function renderStatsFromCache() {

    if (!latestFeedCache) {
        return;
    }

    const latestTs =
        latestFeedCache.timestamp;

    const statStart =
        latestTs -
        statMinutes * 60 * 1000;

    const statFeeds =
        allFeedsCache.filter(feed =>

            feed.timestamp >= statStart &&
            feed.timestamp <= latestTs

        );

    renderStats(statFeeds);
}

// ==========================================
// ThingSpeak API
// ==========================================

function getFeedsURL() {

    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds.json?` +
        `api_key=${READ_API_KEY}&results=1000`
    );
}

function getLatestURL() {

    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds/last.json?` +
        `api_key=${READ_API_KEY}`
    );
}

// ==========================================
// 更新五個即時數據
// ==========================================

function renderLatestData(latest) {

    const temperature = parseValue(
        latest[FIELD_MAP.temperature]
    );

    const humidity = parseValue(
        latest[FIELD_MAP.humidity]
    );

    const co2Indoor = parseValue(
        latest[FIELD_MAP.co2Indoor]
    );

    const co2Outdoor = parseValue(
        latest[FIELD_MAP.co2Outdoor]
    );

    const voltage = parseValue(
        latest[FIELD_MAP.voltage]
    );

    setValue("temperature", temperature, 1);
    setValue("humidity", humidity, 1);
    setValue("co2Indoor", co2Indoor, 0);
    setValue("co2Outdoor", co2Outdoor, 0);
    setValue("voltage", voltage, 2);

    $("co2Indoor").style.color =
        co2Color(co2Indoor);

    $("co2Outdoor").style.color =
        co2Color(co2Outdoor);

    $("updateTime").textContent =
        formatTime(
            new Date(latest.timestamp),
            true
        );
}

// ==========================================
// 讀取 ThingSpeak 資料
// ==========================================

async function loadData() {

    if (loading) {
        return;
    }

    loading = true;

    $("status").textContent = "讀取中...";
    $("status").style.color = "#ffffff";

    try {

        const [
            feedsResponse,
            latestResponse
        ] = await Promise.all([

            fetch(getFeedsURL(), {
                cache: "no-store"
            }),

            fetch(getLatestURL(), {
                cache: "no-store"
            })

        ]);

        if (
            !feedsResponse.ok ||
            !latestResponse.ok
        ) {
            throw new Error(
                "ThingSpeak HTTP 錯誤"
            );
        }

        const feedsJSON =
            await feedsResponse.json();

        const latest =
            await latestResponse.json();

        if (
            !latest ||
            !latest.created_at
        ) {
            throw new Error(
                "找不到最新資料"
            );
        }

        const latestTs =
            new Date(
                latest.created_at
            ).getTime();

        if (!Number.isFinite(latestTs)) {
            throw new Error(
                "最新資料時間無效"
            );
        }

        let allFeeds =
            (feedsJSON.feeds || [])

            .map(feed => ({

                ...feed,

                timestamp:
                    new Date(
                        feed.created_at
                    ).getTime()

            }))

            .filter(feed =>
                Number.isFinite(
                    feed.timestamp
                )
            );

        // 合併最新一筆資料
        const latestFeed = {
            ...latest,
            timestamp: latestTs
        };

        const index = allFeeds.findIndex(
            feed =>
                feed.timestamp === latestTs
        );

        if (index >= 0) {

            allFeeds[index] = {
                ...allFeeds[index],
                ...latestFeed
            };

        } else {

            allFeeds.push(latestFeed);

        }

        allFeeds.sort(
            (a, b) =>
                a.timestamp - b.timestamp
        );

        // 儲存快取
        allFeedsCache = allFeeds;
        latestFeedCache = latestFeed;

        // 更新五個即時數據
        renderLatestData(latestFeed);

        // 更新選擇的圖表
        renderCharts();

        // 更新統計
        renderStatsFromCache();

        $("status").textContent =
            "資料連線正常";

        $("status").style.color =
            "#7df0d0";

    } catch (error) {

        console.error(
            "ThingSpeak 錯誤:",
            error
        );

        $("status").textContent =
            "讀取失敗";

        $("status").style.color =
            "#fbb5b5";

    } finally {

        loading = false;

    }
}

// ==========================================
// 初始化
// ==========================================

// 建立預設圖表卡片
buildChartCards();

// 讀取 ThingSpeak
loadData();

// 每 15 秒更新一次
setInterval(loadData, 15000);

// 視窗大小改變時重新調整圖表
window.addEventListener("resize", () => {

    Object.values(charts).forEach(chart => {

        if (chart) {
            chart.resize();
        }

    });

});

</script>
