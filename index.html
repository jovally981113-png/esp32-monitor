
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧微藻遮陽換氣系統｜花草監控儀表板</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ==============================
   基本設定
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #087c68;
    --dark-green: #075747;
    --soft-green: #e8f6ed;
    --mint: #d5f0df;
    --pink: #f8c8d8;
    --cream: #fffdf5;
    --text: #24554a;
    --muted: #698b80;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 8% 12%, #fce7ed 0%, transparent 23%),
        radial-gradient(circle at 90% 85%, #d7f3df 0%, transparent 27%),
        linear-gradient(135deg, #f4fbf4, #e7f5ed);
}

.dashboard {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ==============================
   SVG 花草共用
============================== */

.floral-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.flower-decoration {
    position: absolute;
    pointer-events: none;
    z-index: 0;
}

.flower-left {
    width: 125px;
    height: 90px;
    left: 12px;
    bottom: -8px;
}

.flower-right {
    width: 130px;
    height: 95px;
    right: 12px;
    bottom: -10px;
    transform: scaleX(-1);
}

.leaf-corner {
    position: absolute;
    right: 8px;
    top: 7px;
    width: 45px;
    height: 45px;
    opacity: 0.35;
    pointer-events: none;
}

/* ==============================
   頂部標題
============================== */

header {
    position: relative;
    flex-shrink: 0;
    min-height: 105px;
    padding: 13px 190px 12px;
    background:
        linear-gradient(120deg, #e6f8e8, #fffdf4 48%, #e1f6e7);
    border-bottom: 3px solid #b7e1c7;
    box-shadow: 0 3px 14px #397b5a18;
    overflow: hidden;
}

.header-center {
    position: relative;
    z-index: 2;
    text-align: center;
}

.header-center h1 {
    color: #076650;
    font-size: clamp(23px, 2.4vw, 35px);
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 1px 2px 0 #ffffff;
    white-space: nowrap;
}

.header-center p {
    font-size: 13px;
    color: #658e79;
    margin-top: 5px;
    letter-spacing: 1px;
}

.title-underline {
    width: 210px;
    max-width: 70%;
    height: 5px;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        transparent,
        #6dc69b,
        #f2b8ce,
        #6dc69b,
        transparent
    );
    margin: 8px auto 0;
}

.system-status {
    position: absolute;
    z-index: 3;
    right: 15px;
    top: 16px;
    background: #ffffffcc;
    border: 1px solid #cdebd6;
    border-radius: 12px;
    padding: 7px 11px;
    font-size: 11px;
    line-height: 1.8;
    color: #477c69;
    white-space: nowrap;
}

/* ==============================
   主要版面
============================== */

main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        minmax(180px, 18%);
    gap: 10px;
    padding: 10px;
}

.center-panel {
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 0;
    min-width: 0;
}

.section-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--dark-green);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.section-title::after {
    content: "❀ ─── ❀";
    font-size: 13px;
    color: #a8d4b4;
    font-weight: normal;
}

/* ==============================
   五個即時數據
============================== */

.sensor-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
    flex-shrink: 0;
}

.sensor-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(150deg, #ffffff, #f5fcf5);
    border: 1px solid #cdebd6;
    border-bottom: 3px solid #a5dcb7;
    border-radius: 15px;
    box-shadow: 0 4px 12px #316d4d12;
    padding: 9px 5px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.sensor-card:nth-child(2n) {
    background: linear-gradient(150deg, #ffffff, #fff8f9);
    border-bottom-color: #efc5d3;
}

.sensor-icon {
    font-size: 23px;
    position: relative;
    z-index: 1;
}

.sensor-name {
    color: var(--muted);
    font-size: 13px;
    margin: 3px 0;
    position: relative;
    z-index: 1;
}

.sensor-value {
    font-size: clamp(19px, 2.5vw, 30px);
    color: var(--green);
    font-weight: 900;
    white-space: nowrap;
    position: relative;
    z-index: 1;
}

.sensor-value small {
    font-size: 12px;
    color: #89a99b;
    font-weight: normal;
}

/* ==============================
   圖表勾選區
============================== */

.chart-selector {
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(110deg, #ffffff, #f6fcf5);
    border: 1px solid #d6ebdc;
    border-radius: 14px;
    box-shadow: 0 3px 12px #316d4d10;
    padding: 10px 12px;
}

.selector-header {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.selector-title {
    font-size: 14px;
    color: #236c55;
    font-weight: bold;
}

.selector-actions {
    display: flex;
    gap: 5px;
}

.small-btn {
    background: #e7f6e9;
    color: #27775a;
    border: 1px solid #c8e9d0;
    border-radius: 13px;
    padding: 5px 10px;
    font-size: 11px;
    cursor: pointer;
}

.small-btn:hover {
    background: #cfeedd;
}

.chart-options {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.chart-option {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    background: #ffffff;
    border: 1px solid #d9e9df;
    border-radius: 20px;
    font-size: 12px;
    color: #4d7768;
    cursor: pointer;
    user-select: none;
}

.chart-option:has(input:checked) {
    background: #e0f5e8;
    border-color: #75c69c;
    color: #116d4c;
    font-weight: bold;
}

.chart-option input {
    accent-color: #16875c;
    cursor: pointer;
}

/* ==============================
   動態圖表
============================== */

.chart-grid {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: grid;
    gap: 9px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
}

.chart-grid[data-count="1"] {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
}

.chart-grid[data-count="2"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
}

.chart-grid[data-count="3"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
}

.chart-grid[data-count="3"] .chart-card:last-child {
    grid-column: span 2;
}

.chart-grid[data-count="4"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
}

.chart-grid[data-count="5"],
.chart-grid[data-count="6"] {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
}

.chart-grid[data-count="5"] .chart-card:last-child {
    grid-column: span 2;
}

.chart-card {
    position: relative;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid #dcefe1;
    border-radius: 15px;
    padding: 10px;
    box-shadow: 0 4px 14px #316d4d12;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
}

.chart-card::before {
    content: "✿";
    position: absolute;
    right: 12px;
    top: 3px;
    font-size: 24px;
    color: #f4d2de;
    opacity: 0.75;
    pointer-events: none;
}

.chart-card::after {
    content: "❧";
    position: absolute;
    left: 8px;
    bottom: 1px;
    font-size: 22px;
    color: #c3e8ce;
    opacity: 0.65;
    pointer-events: none;
}

.chart-title {
    position: relative;
    z-index: 1;
    font-size: 14px;
    font-weight: bold;
    color: #245c4a;
    margin-bottom: 5px;
    display: flex;
    gap: 7px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
}

.chart-title span {
    font-size: 10px;
    font-weight: normal;
    color: #709185;
    background: #e9f6ed;
    border-radius: 12px;
    padding: 3px 8px;
}

.chart-container {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    min-width: 0;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

.empty-charts {
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    border: 1px solid #dcefe1;
    border-radius: 15px;
    color: #709185;
    font-size: 15px;
    text-align: center;
    padding: 20px;
}

/* ==============================
   右側統計
============================== */

.right-panel {
    position: relative;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
    padding: 11px;
    background: linear-gradient(180deg, #ffffff, #f7fcf7);
    border: 1px solid #d6eadb;
    border-radius: 15px;
    box-shadow: 0 4px 14px #316d4d12;
    display: flex;
    flex-direction: column;
}

.panel-title {
    position: relative;
    z-index: 1;
    color: #146d51;
    font-size: 18px;
    font-weight: bold;
}

#statRangeLabel {
    position: relative;
    z-index: 1;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}

.controls {
    position: relative;
    z-index: 1;
    margin: 10px 0 5px;
    flex-shrink: 0;
}

.controls-row {
    margin-bottom: 9px;
}

.controls-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.btn-group button {
    border: 0;
    border-radius: 16px;
    background: #e8f5eb;
    color: #2b7059;
    padding: 6px 9px;
    font-size: 12px;
    cursor: pointer;
}

.btn-group button.active {
    background: #14865e;
    color: white;
}

#statsContainer {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
}

.stat-section {
    border-top: 1px dashed #c9e4d2;
    padding: 5px 0;
}

.stat-name {
    font-size: 13px;
    font-weight: bold;
    color: #28654d;
    margin-bottom: 3px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    padding: 2px 0;
    font-size: 12px;
    color: #688579;
}

.stat-value {
    font-weight: bold;
    color: var(--green);
    white-space: nowrap;
}

/* ==============================
   底部
============================== */

footer {
    position: relative;
    flex-shrink: 0;
    text-align: center;
    padding: 5px;
    color: #6e9a7c;
    font-size: 11px;
    background: #e5f4e7;
    border-top: 1px solid #cbe8d2;
}

footer::before {
    content: "🌸  🌿  ❀";
    margin-right: 12px;
}

footer::after {
    content: "❀  🌿  🌸";
    margin-left: 12px;
}

/* ==============================
   矮螢幕調整
============================== */

@media (max-height: 760px) {
    header {
        min-height: 80px;
        padding-top: 8px;
        padding-bottom: 8px;
    }

    .header-center h1 {
        font-size: 24px;
    }

    .header-center p {
        font-size: 11px;
    }

    .flower-left,
    .flower-right {
        width: 95px;
        height: 70px;
    }

    main {
        padding: 8px;
        gap: 8px;
    }

    .center-panel,
    .chart-grid {
        gap: 7px;
    }

    .sensor-card {
        padding: 4px;
    }

    .sensor-icon {
        font-size: 18px;
    }

    .sensor-value {
        font-size: 21px;
    }

    .chart-selector {
        padding: 7px;
    }

    .chart-option {
        padding: 4px 7px;
        font-size: 11px;
    }

    .chart-card {
        padding: 7px;
    }

    .stat-section {
        padding: 2px 0;
    }

    .stat-row {
        padding: 1px 0;
    }
}

/* ==============================
   響應式
============================== */

@media (max-width: 1050px) {
    header {
        padding-left: 120px;
        padding-right: 120px;
    }

    .system-status {
        position: static;
        width: fit-content;
        margin: 8px auto 0;
    }

    header {
        padding-top: 8px;
        padding-bottom: 8px;
    }
}

@media (max-width: 950px) {
    .dashboard {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
    }

    main {
        display: flex;
        flex-direction: column;
    }

    .center-panel {
        min-height: 700px;
    }

    .chart-grid {
        min-height: 400px;
    }

    .right-panel {
        overflow: visible;
    }
}

@media (max-width: 650px) {
    header {
        padding: 15px 10px;
    }

    .header-center h1 {
        white-space: normal;
        font-size: 23px;
    }

    .flower-left,
    .flower-right {
        opacity: 0.3;
    }

    .sensor-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .sensor-card {
        min-height: 90px;
    }

    .chart-grid,
    .chart-grid[data-count] {
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .chart-card {
        flex: none;
        height: 250px;
    }
}
</style>
</head>

<body>

<div class="dashboard">

<!-- ==============================
     頂部
============================== -->

<header>

    <!-- 左側花草 SVG -->
    <div class="flower-decoration flower-left">
        <svg class="floral-svg" viewBox="0 0 150 110">
            <path d="M18 115 Q35 65 52 22"
                  fill="none"
                  stroke="#68ad78"
                  stroke-width="3"/>
            <path d="M38 75 Q13 52 12 76 Q25 91 38 75"
                  fill="#8acb94"/>
            <path d="M43 55 Q69 38 67 61 Q54 70 43 55"
                  fill="#a1dca3"/>
            <path d="M27 93 Q57 80 53 103 Q37 109 27 93"
                  fill="#74bb87"/>

            <g transform="translate(54 23)">
                <ellipse cx="0" cy="-14" rx="10" ry="17" fill="#f6b9cd"/>
                <ellipse cx="14" cy="-3" rx="10" ry="17" transform="rotate(72 14 -3)" fill="#f9d1df"/>
                <ellipse cx="9" cy="14" rx="10" ry="17" transform="rotate(144 9 14)" fill="#f4b5c9"/>
                <ellipse cx="-9" cy="14" rx="10" ry="17" transform="rotate(216 -9 14)" fill="#f9d1df"/>
                <ellipse cx="-14" cy="-3" rx="10" ry="17" transform="rotate(288 -14 -3)" fill="#f4b5c9"/>

            <path d="M95 115 Q98 78 108 54"

            <path d="M101 85 Q78 72 83 92 Q94 100 101 85"

            <g transform="translate(109 51) scale(.55)">
                <ellipse cx="0" cy="-14" rx="10" ry="17" fill="#ffffff"/>
                <ellipse cx="14" cy="-3" rx="10" ry="17" transform="rotate(72 14 -3)" fill="#fff4e4"/>
                <ellipse cx="9" cy="14" rx="10" ry="17" transform="rotate(144 9 14)" fill="#ffffff"/>
                <ellipse cx="-9" cy="14" rx="10" ry="17" transform="rotate(216 -9 14)" fill="#fff4e4"/>
                <ellipse cx="-14" cy="-3" rx="10" ry="17" transform="rotate(288 -14 -3)" fill="#ffffff"/>
                <circle r="9" fill="#e9c45f"/>

        </svg>
    </div>

    <div class="header-center">
        <h1>🌿 智慧微藻遮陽換氣系統 🌸</h1>

        <div class="title-underline"></div>
    </div>

    <!-- 右側花草 SVG -->
    <div class="flower-decoration flower-right">
        <svg class="floral-svg" viewBox="0 0 150 110">
            <path d="M18 115 Q35 65 52 22"
                  fill="none"
                  stroke="#68ad78"
                  stroke-width="3"/>
            <path d="M38 75 Q13 52 12 76 Q25 91 38 75"
                  fill="#8acb94"/>
            <path d="M43 55 Q69 38 67 61 Q54 70 43 55"
                  fill="#a1dca3"/>
            <path d="M27 93 Q57 80 53 103 Q37 109 27 93"
                  fill="#74bb87"/>

            <g transform="translate(54 23)">
                <ellipse cx="0" cy="-14" rx="10" ry="17" fill="#f6b9cd"/>
                <ellipse cx="14" cy="-3" rx="10" ry="17" transform="rotate(72 14 -3)" fill="#f9d1df"/>
                <ellipse cx="9" cy="14" rx="10" ry="17" transform="rotate(144 9 14)" fill="#f4b5c9"/>
                <ellipse cx="-9" cy="14" rx="10" ry="17" transform="rotate(216 -9 14)" fill="#f9d1df"/>
                <ellipse cx="-14" cy="-3" rx="10" ry="17" transform="rotate(288 -14 -3)" fill="#f4b5c9"/>
                <circle r="9" fill="#f6cf70"/>
            </g>

            <path d="M95 115 Q98 78 108 54"
                  fill="none"
                  stroke="#80bd84"
                  stroke-width="3"/>
            <path d="M101 85 Q78 72 83 92 Q94 100 101 85"
                  fill="#a0d7a4"/>

            <g transform="translate(109 51) scale(.55)">
                <ellipse cx="0" cy="-14" rx="10" ry="17" fill="#ffffff"/>
                <ellipse cx="14" cy="-3" rx="10" ry="17" transform="rotate(72 14 -3)" fill="#fff4e4"/>
                <ellipse cx="9" cy="14" rx="10" ry="17" transform="rotate(144 9 14)" fill="#ffffff"/>
                <ellipse cx="-9" cy="14" rx="10" ry="17" transform="rotate(216 -9 14)" fill="#fff4e4"/>

                <circle r="9" fill="#e9c45f"/>
            </g>
        </svg>
    </div>

    <div class="system-status">
        🌱 系統狀態：<span id="status">連線中...</span>
        <div>🕒 更新時間：<span id="updateTime">--</span></div>
    </div>

</header>

<main>

<!-- ==============================
     主要監控區
============================== -->

<section class="center-panel">

    <div class="section-title">
        即時環境監測
    </div>

    <div class="sensor-grid">

        <div class="sensor-card">
            <div class="leaf-corner">🌿</div>
            <div class="sensor-icon">🌡️</div>
            <div class="sensor-name">水溫</div>
            <div class="sensor-value">
                <span id="temperature">--</span>
                <small>°C</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="leaf-corner">🌸</div>
            <div class="sensor-icon">💧</div>
            <div class="sensor-name">濕度</div>
            <div class="sensor-value">
                <span id="humidity">--</span>
                <small>%</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="leaf-corner">🍃</div>
            <div class="sensor-icon">🏠</div>
            <div class="sensor-name">室內 CO₂</div>
            <div class="sensor-value">
                <span id="co2Indoor">--</span>
                <small>ppm</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="leaf-corner">🌼</div>
            <div class="sensor-icon">🌳</div>
            <div class="sensor-name">室外 CO₂</div>
            <div class="sensor-value">
                <span id="co2Outdoor">--</span>
                <small>ppm</small>
            </div>
        </div>

        <div class="sensor-card">
            <div class="leaf-corner">🌿</div>
            <div class="sensor-icon">⚡</div>
            <div class="sensor-name">電壓</div>
            <div class="sensor-value">
                <span id="voltage">--</span>
                <small>V</small>
            </div>
        </div>

    </div>

    <!-- 圖表選擇 -->

    <div class="chart-selector">

        <div class="selector-header">

            <div class="selector-title">
                🌸 自訂圖表顯示
            </div>

            <div class="selector-actions">
                <button class="small-btn" onclick="selectAllCharts()">
                    全選
                </button>
                <button class="small-btn" onclick="clearAllCharts()">
                    清除
                </button>
            </div>

        </div>

        <div class="chart-options">

            <label class="chart-option">
                <input type="checkbox" value="temperature"
                       checked onchange="updateSelectedCharts()">
                🌡️ 水溫
            </label>

            <label class="chart-option">
                <input type="checkbox" value="humidity"
                       checked onchange="updateSelectedCharts()">
                💧 濕度
            </label>

            <label class="chart-option">
                <input type="checkbox" value="co2Indoor"
                       onchange="updateSelectedCharts()">
                🏠 室內 CO₂
            </label>

            <label class="chart-option">
                <input type="checkbox" value="co2Outdoor"
                       onchange="updateSelectedCharts()">
                🌳 室外 CO₂
            </label>

            <label class="chart-option">
                <input type="checkbox" value="voltage"
                       onchange="updateSelectedCharts()">
                ⚡ 電壓
            </label>

            <label class="chart-option">
                <input type="checkbox" value="co2Compare"
                       checked onchange="updateSelectedCharts()">
                🌫️ 室內＋室外 CO₂ 比較
            </label>

        </div>

    </div>

    <div class="chart-grid" id="chartGrid" data-count="3"></div>

</section>

<!-- ==============================
     右側統計
============================== -->

<aside class="right-panel">

    <div class="panel-title">🌿 數據統計</div>
    <div id="statRangeLabel">(最近 10 分鐘)</div>

    <div class="controls">

        <div class="controls-row">
            <span class="controls-label">📈 圖表筆數</span>

            <div class="btn-group" id="chartBtnGroup">
                <button class="active" onclick="changeChartCount(10)">10筆</button>
                <button onclick="changeChartCount(20)">20筆</button>
                <button onclick="changeChartCount(50)">50筆</button>
                <button onclick="changeChartCount(0)">全部</button>
            </div>
        </div>

        <div class="controls-row">
            <span class="controls-label">⏱ 統計時間</span>

            <div class="btn-group" id="statBtnGroup">
                <button class="active" onclick="changeStatRange(10)">10min</button>
                <button onclick="changeStatRange(30)">30min</button>
                <button onclick="changeStatRange(60)">60min</button>
            </div>
        </div>

    </div>

    <div id="statsContainer"></div>

</aside>

</main>

<footer>
    智慧微藻遮陽換氣系統 · 隊伍編號：大專-創-N075
</footer>

</div>

<script>
"use strict";

/* ======================================
   ThingSpeak 設定
====================================== */

const CHANNEL_ID = "3474112";
const READ_API_KEY = "IT0OTL4TT1QFKXO8";
const TIMEZONE = "Asia/Taipei";

const FIELD_MAP = {
    temperature: "field1",
    humidity: "field2",
    co2Indoor: "field4",
    co2Outdoor: "field5",
    voltage: "field6"
};

/* ======================================
   六種圖表設定
====================================== */

const CHART_CONFIG = {

    temperature: {
        title: "🌡️ 水溫",
        unit: "°C",
        datasets: [
            {
                label: "水溫",
                field: "field1",
                color: "#e76f67"
            }
        ]
    },

    humidity: {
        title: "💧 濕度",
        unit: "%",
        datasets: [
            {
                label: "濕度",
                field: "field2",
                color: "#5a9fd6"
            }
        ]
    },

    co2Indoor: {
        title: "🏠 室內 CO₂",
        unit: "ppm",
        datasets: [
            {
                label: "室內 CO₂",
                field: "field4",
                color: "#e98c6c"
            }
        ]
    },

    co2Outdoor: {
        title: "🌳 室外 CO₂",
        unit: "ppm",
        datasets: [
            {
                label: "室外 CO₂",
                field: "field5",
                color: "#56a6b3"
            }
        ]
    },

    voltage: {
        title: "⚡ 電壓",
        unit: "V",
        datasets: [
            {
                label: "電壓",
                field: "field6",
                color: "#d7a33b"
            }
        ]
    },

    co2Compare: {
        title: "🌫️ 室內與室外 CO₂ 濃度比較",
        unit: "ppm",
        datasets: [
            {
                label: "室內 CO₂",
                field: "field4",
                color: "#e98c6c"
            },
            {
                label: "室外 CO₂",
                field: "field5",
                color: "#56a6b3"
            }
        ]
    }

};

/* ======================================
   全域變數
====================================== */

let chartCount = 10;
let statMinutes = 10;

let charts = {};
let loading = false;

let allFeedsCache = [];
let latestFeedCache = null;

let selectedCharts = [
    "temperature",
    "humidity",
    "co2Compare"
];

const $ = id => document.getElementById(id);

/* ======================================
   時間格式
====================================== */

function formatTime(date, full = false) {

    const options = {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    };

    if (full) {
        options.year = "numeric";
        options.month = "2-digit";
        options.day = "2-digit";
    }

    return new Intl.DateTimeFormat("zh-TW", options).format(date);
}

/* ======================================
   數值處理
====================================== */

function parseValue(value) {

    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number) ? number : null;
}

function setValue(id, value, decimals) {

    $(id).textContent =
        value === null ? "--" : value.toFixed(decimals);
}

function co2Color(value) {

    if (value === null) return "#087c68";
    if (value >= 1500) return "#dc2626";
    if (value >= 1000) return "#f97316";

    return "#087c68";
}

/* ======================================
   圖表勾選
====================================== */

function getSelectedCharts() {

    return Array.from(
        document.querySelectorAll(
            '.chart-options input:checked'
        )
    ).map(input => input.value);
}

window.updateSelectedCharts = function() {

    selectedCharts = getSelectedCharts();

    buildChartCards();
    renderCharts();
};

window.selectAllCharts = function() {

    document.querySelectorAll(
        ".chart-options input"
    ).forEach(input => {
        input.checked = true;
    });

    updateSelectedCharts();
};

window.clearAllCharts = function() {

    document.querySelectorAll(
        ".chart-options input"
    ).forEach(input => {
        input.checked = false;
    });

    updateSelectedCharts();
};

/* ======================================
   動態建立圖表卡片
====================================== */

function buildChartCards() {

    Object.values(charts).forEach(chart => {
        if (chart) chart.destroy();
    });

    charts = {};

    const grid = $("chartGrid");
    grid.innerHTML = "";
    grid.dataset.count = selectedCharts.length;

    if (!selectedCharts.length) {

        grid.innerHTML = `
            <div class="empty-charts">
                🌷 請在上方勾選想顯示的圖表 🌿
            </div>
        `;

        return;
    }

    selectedCharts.forEach(key => {

        const config = CHART_CONFIG[key];

        const card = document.createElement("div");
        card.className = "chart-card";

        const title = document.createElement("div");
        title.className = "chart-title";

        const titleText = document.createElement("div");
        titleText.textContent = config.title;

        const countLabel = document.createElement("span");
        countLabel.className = "count-label";
        countLabel.textContent =
            chartCount === 0 ? "全部" : chartCount + "筆";

        title.appendChild(titleText);
        title.appendChild(countLabel);

        const container = document.createElement("div");
        container.className = "chart-container";

        const canvas = document.createElement("canvas");
        canvas.id = "chart_" + key;

        container.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(container);
        grid.appendChild(card);
    });
}

/* ======================================
   圖表筆數切換
====================================== */

window.changeChartCount = function(count) {

    chartCount = count;

    document.querySelectorAll(
        "#chartBtnGroup button"
    ).forEach(button => {

        button.classList.toggle(
            "active",
            button.textContent ===
                (count === 0 ? "全部" : count + "筆")
        );
    });

    document.querySelectorAll(
        ".count-label"
    ).forEach(element => {

        element.textContent =
            count === 0 ? "全部" : count + "筆";
    });

    renderCharts();
};

/* ======================================
   統計時間切換
====================================== */

window.changeStatRange = function(minutes) {

    statMinutes = minutes;

    document.querySelectorAll(
        "#statBtnGroup button"
    ).forEach(button => {

        button.classList.toggle(
            "active",
            button.textContent === minutes + "min"
        );
    });

    $("statRangeLabel").textContent =
        `(最近 ${minutes} 分鐘)`;

    renderStatsFromCache();
};

/* ======================================
   取得圖表資料點
====================================== */

function getPoints(feeds, field) {

    return feeds.flatMap(feed => {

        const value = parseValue(feed[field]);

        if (value === null) return [];

        return [{
            x: feed.timestamp,
            y: value
        }];
    });
}

/* ======================================
   建立 Chart.js 圖表
====================================== */

function createChart(key, config, feeds, start, end) {

    const canvas = $("chart_" + key);

    if (!canvas) return;

    if (charts[key]) {
        charts[key].destroy();
    }

    const datasets = config.datasets.map(item => ({

        label: item.label,

        data: getPoints(feeds, item.field),

        borderColor: item.color,

        backgroundColor: item.color + "18",

        borderWidth: 2.5,

        pointRadius: feeds.length > 50 ? 0 : 3,

        pointHoverRadius: 6,

        pointBackgroundColor: item.color,

        tension: 0.25,

        fill: false,

        spanGaps: false

    }));

    charts[key] = new Chart(canvas, {

        type: "line",

        data: {
            datasets
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            animation: {
                duration: 200
            },

            interaction: {
                mode: "nearest",
                intersect: false
            },

            plugins: {

                legend: {

                    display: datasets.length > 1,

                    position: "top",

                    labels: {
                        usePointStyle: true,
                        boxWidth: 9,
                        font: {
                            size: 11
                        }
                    }
                },

                tooltip: {

                    callbacks: {

                        title: context => {

                            if (!context.length) return "";

                            return formatTime(
                                new Date(context[0].parsed.x),
                                true
                            );
                        },

                        label: context => {

                            const decimals =
                                config.unit === "ppm"
                                    ? 0
                                    : config.unit === "V"
                                        ? 2
                                        : 1;

                            return (
                                context.dataset.label +
                                ": " +
                                context.parsed.y.toFixed(decimals) +
                                " " +
                                config.unit
                            );
                        }
                    }
                }
            },

            scales: {

                x: {

                    type: "linear",

                    min: start,
                    max: end,

                    ticks: {

                        maxTicksLimit: 6,

                        font: {
                            size: 10
                        },

                        callback: value =>
                            formatTime(new Date(value))
                    },

                    grid: {
                        display: false
                    }
                },

                y: {

                    beginAtZero: false,

                    ticks: {
                        font: {
                            size: 10
                        }
                    },

                    grid: {
                        color: "rgba(20,100,50,0.06)"
                    }
                }
            }
        }
    });
}

/* ======================================
   更新圖表
====================================== */

function renderCharts() {

    if (!allFeedsCache.length) return;

    const feeds = chartCount === 0
        ? allFeedsCache
        : allFeedsCache.slice(-chartCount);

    if (!feeds.length) return;

    const firstTs = feeds[0].timestamp;
    const lastTs = feeds[feeds.length - 1].timestamp;

    const start = firstTs === lastTs
        ? firstTs - 30000
        : firstTs;

    const end = firstTs === lastTs
        ? lastTs + 30000
        : lastTs;

    selectedCharts.forEach(key => {

        createChart(
            key,
            CHART_CONFIG[key],
            feeds,
            start,
            end
        );
    });
}

/* ======================================
   統計計算
====================================== */

function getStats(feeds, field) {

    const values = feeds
        .map(feed => parseValue(feed[field]))
        .filter(value => value !== null);

    if (!values.length) return null;

    const sum = values.reduce(
        (total, value) => total + value,
        0
    );

    return {
        max: Math.max(...values),
        min: Math.min(...values),
        avg: sum / values.length
    };
}

/* ======================================
   顯示統計
====================================== */

function renderStats(feeds) {

    const configs = [

        {
            name: "🌡️ 水溫",
            field: FIELD_MAP.temperature,
            unit: "°C",
            decimals: 1
        },

        {
            name: "💧 濕度",
            field: FIELD_MAP.humidity,
            unit: "%",
            decimals: 1
        },

        {
            name: "🏠 室內 CO₂",
            field: FIELD_MAP.co2Indoor,
            unit: "ppm",
            decimals: 0
        },

        {
            name: "🌳 室外 CO₂",
            field: FIELD_MAP.co2Outdoor,
            unit: "ppm",
            decimals: 0
        },

        {
            name: "⚡ 電壓",
            field: FIELD_MAP.voltage,
            unit: "V",
            decimals: 2
        }

    ];

    $("statsContainer").innerHTML =
        configs.map(config => {

            const stats = getStats(feeds, config.field);

            function display(key) {

                if (!stats) return "--";

                return (
                    stats[key].toFixed(config.decimals) +
                    " " +
                    config.unit
                );
            }

            return `
                <div class="stat-section">

                    <div class="stat-name">
                        ${config.name}
                    </div>

                    <div class="stat-row">
                        <span>最高</span>
                        <span class="stat-value">
                            ${display("max")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>最低</span>
                        <span class="stat-value">
                            ${display("min")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>平均</span>
                        <span class="stat-value">
                            ${display("avg")}
                        </span>
                    </div>

                </div>
            `;

        }).join("");
}

/* ======================================
   重新計算統計
====================================== */

function renderStatsFromCache() {

    if (!latestFeedCache) return;

    const latestTs = latestFeedCache.timestamp;

    const statStart =
        latestTs - statMinutes * 60 * 1000;

    const statFeeds = allFeedsCache.filter(
        feed =>
            feed.timestamp >= statStart &&
            feed.timestamp <= latestTs
    );

    renderStats(statFeeds);
}

/* ======================================
   ThingSpeak API
====================================== */

function getFeedsURL() {

    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds.json?` +
        `api_key=${READ_API_KEY}&results=1000`
    );
}

function getLatestURL() {

    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds/last.json?` +
        `api_key=${READ_API_KEY}`
    );
}

/* ======================================
   五個即時數據
====================================== */

function renderLatestData(latest) {

    const temperature = parseValue(
        latest[FIELD_MAP.temperature]
    );

    const humidity = parseValue(
        latest[FIELD_MAP.humidity]
    );

    const co2Indoor = parseValue(
        latest[FIELD_MAP.co2Indoor]
    );

    const co2Outdoor = parseValue(
        latest[FIELD_MAP.co2Outdoor]
    );

    const voltage = parseValue(
        latest[FIELD_MAP.voltage]
    );

    setValue("temperature", temperature, 1);
    setValue("humidity", humidity, 1);
    setValue("co2Indoor", co2Indoor, 0);
    setValue("co2Outdoor", co2Outdoor, 0);
    setValue("voltage", voltage, 2);

    $("co2Indoor").style.color = co2Color(co2Indoor);
    $("co2Outdoor").style.color = co2Color(co2Outdoor);

    $("updateTime").textContent =
        formatTime(new Date(latest.timestamp), true);
}

/* ======================================
   讀取 ThingSpeak
====================================== */

async function loadData() {

    if (loading) return;

    loading = true;

    $("status").textContent = "讀取中...";
    $("status").style.color = "#4b8067";

    try {

        const [feedsResponse, latestResponse] =
            await Promise.all([

                fetch(getFeedsURL(), {
                    cache: "no-store"
                }),

                fetch(getLatestURL(), {
                    cache: "no-store"
                })

            ]);

        if (!feedsResponse.ok || !latestResponse.ok) {
            throw new Error("ThingSpeak HTTP 錯誤");
        }

        const feedsJSON = await feedsResponse.json();
        const latest = await latestResponse.json();

        if (!latest || !latest.created_at) {
            throw new Error("找不到最新資料");
        }

        const latestTs =
            new Date(latest.created_at).getTime();

        if (!Number.isFinite(latestTs)) {
            throw new Error("最新資料時間無效");
        }

        let allFeeds = (feedsJSON.feeds || [])

            .map(feed => ({
                ...feed,
                timestamp: new Date(
                    feed.created_at
                ).getTime()
            }))

            .filter(feed =>
                Number.isFinite(feed.timestamp)
            );

        const latestFeed = {
            ...latest,
            timestamp: latestTs
        };

        const index = allFeeds.findIndex(
            feed => feed.timestamp === latestTs
        );

        if (index >= 0) {
            allFeeds[index] = {
                ...allFeeds[index],
                ...latestFeed
            };
        } else {
            allFeeds.push(latestFeed);
        }

        allFeeds.sort(
            (a, b) => a.timestamp - b.timestamp
        );

        allFeedsCache = allFeeds;
        latestFeedCache = latestFeed;

        renderLatestData(latestFeed);
        renderCharts();
        renderStatsFromCache();

        $("status").textContent = "資料連線正常";
        $("status").style.color = "#087c68";

    } catch (error) {

        console.error("ThingSpeak 錯誤:", error);

        $("status").textContent = "讀取失敗";
        $("status").style.color = "#dc2626";

    } finally {
        loading = false;
    }
}

/* ======================================
   初始化
====================================== */

buildChartCards();
loadData();

// 每 15 秒更新
setInterval(loadData, 15000);

// 視窗大小變化時重新調整圖表
window.addEventListener("resize", () => {

    Object.values(charts).forEach(chart => {
        if (chart) chart.resize();
    });

});
</script>

</body>
