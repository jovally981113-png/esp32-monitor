<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>智慧微藻遮陽換氣系統 · 優化版</title>
    <!-- Chart.js 輕量渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ===== 全域重置 & 變數 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #087f6f;
            --primary-light: #18a999;
            --bg-soft: #dff5ef;
            --card-bg: #ffffff;
            --text-dark: #173b36;
            --text-muted: #5f7f78;
            --shadow-card: 0 6px 18px rgba(0, 80, 70, 0.10);
            --radius-card: 18px;
            --transition: 0.25s ease;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft JhengHei", "Segoe UI", Roboto, system-ui, sans-serif;
            background: var(--bg-soft);
            color: var(--text-dark);
        }

        /* ===== 儀表板容器 ===== */
        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* ===== 頂欄 ===== */
        .header {
            flex-shrink: 0;
            height: 82px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 4px 14px rgba(0, 60, 50, 0.20);
            z-index: 2;
        }

        .title-area h1 {
            font-size: 30px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .title-area p {
            font-size: 16px;
            color: #cceee8;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .system-area {
            text-align: right;
            font-size: 17px;
            line-height: 1.6;
            color: #d9f5ef;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 18px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }
        .status-ok { color: #a7f3d0; font-weight: 600; }
        .status-error { color: #fecaca; font-weight: 600; }

        /* ===== 主區塊 (Grid) ===== */
        .main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 22% minmax(0, 1fr) 24%;
            gap: 16px;
            padding: 16px 18px 12px 18px;
        }

        /* ===== 左側感應卡 ===== */
        .left-panel {
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            gap: 14px;
            min-height: 0;
        }

        .sensor-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-card);
            border-left: 6px solid var(--primary-light);
            transition: transform var(--transition), box-shadow var(--transition);
            padding: 6px 4px;
        }
        .sensor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 90, 75, 0.15);
        }

        .sensor-icon {
            font-size: 40px;
            line-height: 1.2;
            margin-bottom: 2px;
        }
        .sensor-name {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .sensor-value {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 40px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        .sensor-unit {
            font-size: 18px;
            font-weight: 400;
            color: #8ba9a3;
        }

        /* ===== 中間 2x2 圖表 ===== */
        .center-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 14px;
            min-height: 0;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 12px 14px 8px 14px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            min-height: 0;
            transition: box-shadow var(--transition);
        }
        .chart-card:hover {
            box-shadow: 0 10px 22px rgba(0, 80, 70, 0.12);
        }

        .chart-title {
            font-size: 19px;
            font-weight: 600;
            color: #174f47;
            flex-shrink: 0;
            height: 32px;
            display: flex;
            align-items: center;
            letter-spacing: 0.2px;
        }
        .chart-container {
            flex: 1;
            min-height: 0;
            position: relative;
            width: 100%;
        }

        /* ===== 右側統計 — 完全填滿，不留空白 ===== */
        .right-panel {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 16px 18px 12px 18px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            min-height: 0;          /* 允許收縮 */
            height: 100%;           /* 填滿 grid 單元格 */
            overflow-y: auto;       /* 若內容過多可滾動 */
            scrollbar-width: thin;
        }
        .right-panel::-webkit-scrollbar { width: 4px; }
        .right-panel::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 8px; }

        .right-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .data-selector button {
            border: none;
            border-radius: 30px;
            padding: 10px 0;
            background: #d8eee9;
            color: #24564f;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        .data-selector button:hover {
            background: #bfe4dc;
            transform: scale(0.97);
        }
        .data-selector button.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(8, 127, 111, 0.3);
        }

        /* 統計區塊 — 使用 flex 撐滿剩餘空間 */
        .stats-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;              /* 區塊之間小間隙 */
            min-height: 0;
        }

        .stat-section {
            flex: 1;               /* 每個區塊平均分配剩餘高度 */
            display: flex;
            flex-direction: column;
            justify-content: center;  /* 垂直置中內容 */
            padding: 4px 0;
            border-top: 1px solid #dceeea;
        }
        .stat-section:first-of-type {
            border-top: none;
        }

        .stat-name {
            font-size: 19px;
            font-weight: 600;
            color: #24564f;
            margin-bottom: 2px;
            flex-shrink: 0;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 17px;
            color: #66837d;
        }
        .stat-value {
            font-weight: 600;
            color: var(--primary);
            font-size: 17px;
        }

        /* ===== 頁尾 ===== */
        .footer {
            flex-shrink: 0;
            height: 28px;
            text-align: center;
            font-size: 13px;
            color: #65938a;
            letter-spacing: 1px;
            background: transparent;
        }

        /* ===== 響應式：筆電 ===== */
        @media (max-width: 1200px) {
            .header { height: 72px; padding: 0 18px; }
            .title-area h1 { font-size: 24px; }
            .title-area p { font-size: 14px; }
            .system-area { font-size: 15px; padding: 4px 14px; }
            .sensor-value { font-size: 34px; }
            .sensor-name { font-size: 18px; }
            .sensor-icon { font-size: 34px; }
            .sensor-unit { font-size: 16px; }
            .chart-title { font-size: 17px; height: 28px; }
            .right-title { font-size: 21px; }
            .stat-name { font-size: 17px; }
            .stat-row { font-size: 15px; }
            .stat-value { font-size: 15px; }
            .data-selector button { font-size: 15px; padding: 8px 0; }
            .main { gap: 12px; padding: 12px; }
        }

        /* ===== 手機 ===== */
        @media (max-width: 760px) {
            html, body { overflow: auto; }
            .dashboard { height: auto; }
            .main {
                display: block;
                padding: 12px;
            }
            .left-panel {
                height: 480px;
                margin-bottom: 16px;
                grid-template-rows: repeat(4, 1fr);
            }
            .center-panel {
                height: 640px;
                margin-bottom: 16px;
            }
            .right-panel {
                min-height: 500px;
                height: auto;
                margin-bottom: 12px;
            }
            .header {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
                gap: 6px;
            }
            .system-area {
                text-align: left;
                width: 100%;
                background: transparent;
                padding: 4px 0;
                backdrop-filter: none;
            }
            .title-area h1 { font-size: 22px; }
            .sensor-value { font-size: 32px; }
            .stats-container {
                gap: 2px;
            }
            .stat-section {
                padding: 6px 0;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="title-area">
            <h1>🌿 智慧微藻遮陽換氣系統</h1>
            <p>Smart Microalgae Shading · 即時監控</p>
        </div>
        <div class="system-area">
            <span>🟢 系統狀態：</span>
            <span id="status" class="status-ok">連線中...</span>
            <span style="margin-left: 12px;">🕒 最後更新：</span>
            <span id="updateTime">--</span>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="main">

        <!-- 左：感測器 -->
        <section class="left-panel">
            <div class="sensor-card">
                <div class="sensor-icon">🌡️</div>
                <div class="sensor-name">溫度</div>
                <div class="sensor-value"><span id="temperature">--</span><span class="sensor-unit">°C</span></div>
            </div>
            <div class="sensor-card">
                <div class="sensor-icon">💧</div>
                <div class="sensor-name">濕度</div>
                <div class="sensor-value"><span id="humidity">--</span><span class="sensor-unit">%</span></div>
            </div>
            <div class="sensor-card">
                <div class="sensor-icon">☀️</div>
                <div class="sensor-name">光照</div>
                <div class="sensor-value"><span id="light">--</span><span class="sensor-unit">Lux</span></div>
            </div>
            <div class="sensor-card">
                <div class="sensor-icon">🌫️</div>
                <div class="sensor-name">CO₂ 濃度</div>
                <div class="sensor-value"><span id="co2">--</span><span class="sensor-unit">ppm</span></div>
            </div>
        </section>

        <!-- 中：圖表 2x2 -->
        <section class="center-panel">
            <div class="chart-card">
                <div class="chart-title">🌡️ 溫度</div>
                <div class="chart-container"><canvas id="temperatureChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">💧 濕度</div>
                <div class="chart-container"><canvas id="humidityChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">☀️ 光照</div>
                <div class="chart-container"><canvas id="lightChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">🌫️ CO₂</div>
                <div class="chart-container"><canvas id="co2Chart"></canvas></div>
            </div>
        </section>

        <!-- 右：統計 — 使用 .stats-container 撐滿 -->
        <aside class="right-panel">
            <div class="right-title">📊 數據統計</div>
            <div class="data-selector">
                <button id="btn10min" class="active" onclick="changeTimeRange(10)">10分鐘</button>
                <button id="btn30min" onclick="changeTimeRange(30)">30分鐘</button>
                <button id="btn60min" onclick="changeTimeRange(60)">1小時</button>
            </div>

            <div class="stats-container">
                <!-- 溫度 -->
                <div class="stat-section"><div class="stat-name">🌡️ 溫度</div>
                    <div class="stat-row"><span>最高</span><span class="stat-value" id="tempMax">--</span></div>
                    <div class="stat-row"><span>最低</span><span class="stat-value" id="tempMin">--</span></div>
                    <div class="stat-row"><span>平均</span><span class="stat-value" id="tempAvg">--</span></div>
                </div>
                <!-- 濕度 -->
                <div class="stat-section"><div class="stat-name">💧 濕度</div>
                    <div class="stat-row"><span>最高</span><span class="stat-value" id="humMax">--</span></div>
                    <div class="stat-row"><span>最低</span><span class="stat-value" id="humMin">--</span></div>
                    <div class="stat-row"><span>平均</span><span class="stat-value" id="humAvg">--</span></div>
                </div>
                <!-- 光照 -->
                <div class="stat-section"><div class="stat-name">☀️ 光照</div>
                    <div class="stat-row"><span>最高</span><span class="stat-value" id="lightMax">--</span></div>
                    <div class="stat-row"><span>最低</span><span class="stat-value" id="lightMin">--</span></div>
                    <div class="stat-row"><span>平均</span><span class="stat-value" id="lightAvg">--</span></div>
                </div>
                <!-- CO2 -->
                <div class="stat-section"><div class="stat-name">🌫️ CO₂</div>
                    <div class="stat-row"><span>最高</span><span class="stat-value" id="co2Max">--</span></div>
                    <div class="stat-row"><span>最低</span><span class="stat-value" id="co2Min">--</span></div>
                    <div class="stat-row"><span>平均</span><span class="stat-value" id="co2Avg">--</span></div>
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer">Smart Microalgae Shading System · 即時更新</footer>
</div>

<script>
    (function() {
        "use strict";

        // ===== ThingSpeak 設定 =====
        const CHANNEL_ID = "3474112";
        const READ_API_KEY = "IT0OTL4TT1QFKXO8";
        const TAIWAN_TIMEZONE = "Asia/Taipei";

        let timeRangeMinutes = 10;

        // ===== 圖表實例 =====
        let temperatureChart, humidityChart, lightChart, co2Chart;

        // ===== 輔助函式 =====
        function formatTaiwanTime(date) {
            return new Intl.DateTimeFormat("zh-TW", {
                timeZone: TAIWAN_TIMEZONE,
                year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit", second: "2-digit",
                hour12: false
            }).format(date);
        }
        function formatChartTime(ts) {
            return new Intl.DateTimeFormat("zh-TW", {
                timeZone: TAIWAN_TIMEZONE,
                hour: "2-digit", minute: "2-digit", second: "2-digit",
                hour12: false
            }).format(new Date(ts));
        }
        function avg(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

        function updateStats(values, maxId, minId, avgId, unit, decimals) {
            if (!values.length) {
                [maxId, minId, avgId].forEach(id => document.getElementById(id).textContent = "--");
                return;
            }
            const max = Math.max(...values), min = Math.min(...values), mean = avg(values);
            document.getElementById(maxId).textContent = max.toFixed(decimals) + unit;
            document.getElementById(minId).textContent = min.toFixed(decimals) + unit;
            document.getElementById(avgId).textContent = mean.toFixed(decimals) + unit;
        }

        // ===== 切換時間 =====
        window.changeTimeRange = function(minutes) {
            timeRangeMinutes = minutes;
            document.querySelectorAll(".data-selector button").forEach(b => b.classList.remove("active"));
            const map = {10:"btn10min", 30:"btn30min", 60:"btn60min"};
            if (map[minutes]) document.getElementById(map[minutes]).classList.add("active");
            loadData();
        };

        // ===== API 網址 =====
        function getFeedsURL() {
            return `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&results=1000`;
        }
        function getLatestURL() {
            return `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?api_key=${READ_API_KEY}`;
        }

        // ===== 建立圖表 (共用 options) =====
        function buildChart(canvasId, label, dataPoints, unit, startTime, endTime) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return null;
            const colorMap = {
                'temperatureChart': '#e74c3c',
                'humidityChart': '#3498db',
                'lightChart': '#f39c12',
                'co2Chart': '#2ecc71'
            };
            const borderColor = colorMap[canvasId] || '#18a999';

            return new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: label,
                        data: dataPoints,
                        borderColor: borderColor,
                        backgroundColor: borderColor + '22',
                        borderWidth: 2.8,
                        pointRadius: 2.5,
                        pointHoverRadius: 6,
                        tension: 0.2,
                        fill: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'nearest', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (ctx) => {
                                    if (!ctx.length) return '';
                                    return formatTaiwanTime(new Date(ctx[0].parsed.x));
                                },
                                label: (ctx) => {
                                    const d = (unit === 'ppm') ? 0 : 1;
                                    return Number(ctx.parsed.y).toFixed(d) + ' ' + unit;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: startTime,
                            max: endTime,
                            ticks: {
                                maxTicksLimit: 7,
                                font: { size: 12 },
                                callback: (v) => formatChartTime(v)
                            }
                        },
                        y: {
                            beginAtZero: false,
                            ticks: { font: { size: 12 } }
                        }
                    }
                }
            });
        }

        // ===== 核心載入 =====
        async function loadData() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '讀取中...';
            statusEl.className = 'status-ok';

            try {
                const [feedsResp, latestResp] = await Promise.all([
                    fetch(getFeedsURL(), { cache: 'no-store' }),
                    fetch(getLatestURL(), { cache: 'no-store' })
                ]);
                if (!feedsResp.ok || !latestResp.ok) throw new Error('HTTP 錯誤');

                const feedsData = await feedsResp.json();
                const latestData = await latestResp.json();

                if (!feedsData.feeds?.length) throw new Error('無歷史資料');
                if (!latestData?.created_at) throw new Error('無最新資料');

                // 所有 feeds 轉為 timestamp
                const allFeeds = feedsData.feeds
                    .map(item => {
                        const ts = new Date(item.created_at).getTime();
                        return { ...item, timestamp: ts };
                    })
                    .filter(item => Number.isFinite(item.timestamp))
                    .sort((a, b) => a.timestamp - b.timestamp);

                const latestTs = new Date(latestData.created_at).getTime();
                if (!Number.isFinite(latestTs)) throw new Error('最新時間無效');

                // 更新時間
                document.getElementById('updateTime').textContent = formatTaiwanTime(new Date(latestTs));

                // 更新即時數值 (latest)
                const fields = [latestData.field1, latestData.field2, latestData.field3, latestData.field4];
                const ids = ['temperature', 'humidity', 'light', 'co2'];
                const decimals = [1,1,1,0];
                ids.forEach((id, idx) => {
                    const val = parseFloat(fields[idx]);
                    if (!isNaN(val)) {
                        document.getElementById(id).textContent = val.toFixed(decimals[idx]);
                    }
                });
                // CO2 顏色警示
                const co2Val = parseFloat(latestData.field4);
                const co2El = document.getElementById('co2');
                if (!isNaN(co2Val)) {
                    co2El.style.color = co2Val >= 1500 ? '#dc2626' : (co2Val >= 1000 ? '#f97316' : '#087f6f');
                }

                // 圖表時間範圍 (以最新為基準)
                const endTime = latestTs;
                const startTime = endTime - timeRangeMinutes * 60 * 1000;

                // 篩選
                const filtered = allFeeds.filter(item => item.timestamp >= startTime && item.timestamp <= endTime)
                                         .sort((a,b) => a.timestamp - b.timestamp);

                // 各數據陣列
                const temps = [], hums = [], lights = [], co2s = [];
                const tempPoints = [], humPoints = [], lightPoints = [], co2Points = [];

                filtered.forEach(item => {
                    const t = parseFloat(item.field1);
                    const h = parseFloat(item.field2);
                    const l = parseFloat(item.field3);
                    const c = parseFloat(item.field4);
                    if (!isNaN(t)) { temps.push(t); tempPoints.push({ x: item.timestamp, y: t }); }
                    if (!isNaN(h)) { hums.push(h); humPoints.push({ x: item.timestamp, y: h }); }
                    if (!isNaN(l)) { lights.push(l); lightPoints.push({ x: item.timestamp, y: l }); }
                    if (!isNaN(c)) { co2s.push(c); co2Points.push({ x: item.timestamp, y: c }); }
                });

                // 更新統計
                updateStats(temps, 'tempMax', 'tempMin', 'tempAvg', ' °C', 1);
                updateStats(hums, 'humMax', 'humMin', 'humAvg', ' %', 1);
                updateStats(lights, 'lightMax', 'lightMin', 'lightAvg', ' Lux', 1);
                updateStats(co2s, 'co2Max', 'co2Min', 'co2Avg', ' ppm', 0);

                // 銷毀舊圖表
                [temperatureChart, humidityChart, lightChart, co2Chart].forEach(ch => { if (ch) ch.destroy(); });

                // 建立新圖表
                temperatureChart = buildChart('temperatureChart', '溫度', tempPoints, '°C', startTime, endTime);
                humidityChart = buildChart('humidityChart', '濕度', humPoints, '%', startTime, endTime);
                lightChart = buildChart('lightChart', '光照', lightPoints, 'Lux', startTime, endTime);
                co2Chart = buildChart('co2Chart', 'CO₂', co2Points, 'ppm', startTime, endTime);

                statusEl.textContent = '資料連線正常';
                statusEl.className = 'status-ok';

            } catch (err) {
                console.error('ThingSpeak 錯誤:', err);
                statusEl.textContent = '讀取失敗';
                statusEl.className = 'status-error';
            }
        }

        // ===== 啟動 & 定時 =====
        loadData();
        setInterval(loadData, 15000);
    })();
</script>
</body>
</html>
