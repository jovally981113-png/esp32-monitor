
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智慧微藻遮陽換氣系統</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
    background: #e8f6f2;
    color: #1a3d37;
}

:root {
    --primary: #0a7a6a;
    --muted: #5f7f78;
    --shadow: 0 3px 12px #00463c16;
}

/* 整頁固定在瀏覽器可視高度 */
.dashboard {
    height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ===== 頂部標題 ===== */

header {
    flex: 0 0 82px;
    background: linear-gradient(
        115deg,
        #064e46,
        #08796b 60%,
        #0c8b79
    );
    color: white;
    padding: 7px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    border-bottom: 2px solid #4dd4b4;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-icon {
    font-size: 27px;
}

.brand h1 {
    font-size: clamp(22px, 2vw, 30px);
    margin: 0;
    font-weight: 800;
    letter-spacing: 1px;
}

.brand p {
    font-size: 13px;
    color: #c4f0e5;
    margin: 3px 0 0;
}

/* ===== 系統狀態 ===== */

.system-status {
    background: #ffffff1e;
    border: 1px solid #ffffff30;
    border-radius: 12px;
    padding: 7px 13px;
    flex-shrink: 0;
}

.status-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    line-height: 1.7;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fce7a1;
}

.status-label {
    color: #c4f0e5;
}

#status {
    color: #fce7a1;
    font-weight: 700;
}

#updateTime {
    font-variant-numeric: tabular-nums;
}

/* ===== 主畫面三欄 ===== */

main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns:
        minmax(170px, 20%)
        minmax(0, 1fr)
        minmax(210px, 23%);
    gap: 12px;
    padding: 12px;
}

/* ===== 左側即時數據 ===== */

.left-panel {
    min-height: 0;
    display: grid;
    grid-template-rows:
        auto repeat(4, minmax(0, 1fr));
    gap: 9px;
}

.panel-title {
    font-size: 21px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.35;
    margin: 0;
}

.sensor-card,
.chart-card,
.right-panel {
    background: white;
    border-radius: 14px;
    box-shadow: var(--shadow);
    min-height: 0;
}

.sensor-card {
    border-left: 4px solid #1fb3a0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
}

.sensor-icon {
    font-size: clamp(18px, 2.5vh, 27px);
}

.sensor-name {
    font-size: 15px;
    color: var(--muted);
}

.sensor-value {
    font-size: clamp(22px, 3.8vh, 36px);
    font-weight: 800;
    color: var(--primary);
    line-height: 1.3;
}

.sensor-value small {
    font-size: 14px;
    font-weight: 400;
    color: #8ba9a3;
}

/* ===== 中間圖表 ===== */

.center-panel {
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);
    gap: 12px;
}

.chart-card {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chart-card.wide {
    grid-column: span 2;
}

.chart-title {
    font-size: 18px;
    font-weight: 800;
    color: #1a4d44;
    flex-shrink: 0;
    margin-bottom: 5px;
}

.count-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    background: #e8f6f2;
    border-radius: 12px;
    padding: 3px 7px;
}

.chart-container {
    flex: 1;
    min-height: 0;
    position: relative;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

/* ===== 右側統計 ===== */

.right-panel {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}

#statRangeLabel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
}

.controls {
    display: grid;
    gap: 8px;
    margin: 10px 0;
}

.controls-label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
}

.btn-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}

.btn-group button {
    border: 0;
    border-radius: 14px;
    padding: 5px 9px;
    font-size: 12px;
    background: #eaf5f2;
    color: #24564f;
    cursor: pointer;
}

.btn-group button.active {
    background: var(--primary);
    color: white;
}

#statsContainer {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(4, minmax(0, 1fr));
}

.stat-section {
    min-height: 0;
    border-top: 1px solid #e6f0ed;
    padding: 5px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.stat-name {
    font-size: 15px;
    font-weight: 700;
    color: #24564f;
    margin-bottom: 2px;
}

.stat-row {
    font-size: clamp(11px, 1.5vh, 14px);
    color: #66837d;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    line-height: 1.5;
}

.stat-value {
    color: var(--primary);
    font-weight: 700;
    white-space: nowrap;
}

footer {
    flex: 0 0 21px;
    text-align: center;
    color: #8aa8a0;
    font-size: 11px;
    line-height: 21px;
}

/* ===== 螢幕高度較小時 ===== */

@media (max-height: 740px) and (min-width: 901px) {
    header {
        flex-basis: 68px;
    }

    .brand h1 {
        font-size: 24px;
    }

    .brand p {
        font-size: 11px;
    }

    main {
        padding: 8px;
        gap: 8px;
    }

    .center-panel {
        gap: 8px;
    }

    .left-panel {
        gap: 6px;
    }

    .chart-card {
        padding: 7px 9px;
    }

    .chart-title {
        font-size: 16px;
    }

    .right-panel {
        padding: 8px 11px;
    }

    .controls {
        gap: 4px;
        margin: 5px 0;
    }

    .stat-section {
        padding: 2px 0;
    }

    .stat-row {
        line-height: 1.3;
    }

    footer {
        flex-basis: 16px;
        line-height: 16px;
    }
}

/* ===== 平板及手機版 ===== */

@media (max-width: 900px) {
    .dashboard {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
    }

    header {
        flex-basis: auto;
        min-height: 78px;
        flex-wrap: wrap;
    }

    .system-status {
        min-width: 230px;
    }

    main {
        grid-template-columns: 1fr;
        overflow: visible;
    }

    .left-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto repeat(2, 105px);
    }

    .left-panel .panel-title {
        grid-column: span 2;
    }

    .center-panel {
        grid-template-rows: 260px 300px;
    }

    .right-panel {
        overflow: visible;
    }

    #statsContainer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto auto;
        gap: 8px;
    }

    .stat-section {
        padding: 10px;
    }

    .stat-row {
        font-size: 13px;
    }

    footer {
        flex-basis: 22px;
    }
}

@media (max-width: 520px) {
    header {
        padding: 12px;
    }

    .brand h1 {
        font-size: 21px;
    }

    .brand p {
        font-size: 11px;
    }

    .system-status {
        width: 100%;
    }

    .center-panel {
        display: flex;
        flex-direction: column;
    }

    .chart-card {
        height: 240px;
        flex: none;
    }

    .chart-card.wide {
        height: 290px;
    }

    .right-panel #statsContainer {
        grid-template-columns: 1fr;
    }

    .sensor-value {
        font-size: 26px;
    }
}
</style>
</head>

<body>
<div class="dashboard">

<!-- ===== 頂部 ===== -->

<header>
    <div class="brand">
        <div class="brand-icon">🌿</div>
        <div>
            <h1>智慧微藻遮陽換氣系統</h1>
            <p>
                Smart Microalgae Shading · 即時環境監控平台
            </p>
        </div>
    </div>

    <div class="system-status">
        <div class="status-row">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label">系統狀態</span>
            <span id="status">連線中...</span>
        </div>
        <div class="status-row">
            <span>🕒</span>
            <span class="status-label">最後更新</span>
            <span id="updateTime">--</span>
        </div>
    </div>
</header>

<main>

<!-- ===== 左側即時數據 ===== -->

<section class="left-panel">
    <div class="panel-title">📡 即時數據</div>

    <div class="sensor-card">
        <div class="sensor-icon">🌡️</div>
        <div class="sensor-name">水溫</div>
        <div class="sensor-value">
            <span id="temperature">--</span>
            <small>°C</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">💧</div>
        <div class="sensor-name">濕度</div>
        <div class="sensor-value">
            <span id="humidity">--</span>
            <small>%</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🏠</div>
        <div class="sensor-name">室內 CO₂</div>
        <div class="sensor-value">
            <span id="co2Indoor">--</span>
            <small>ppm</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🌳</div>
        <div class="sensor-name">室外 CO₂</div>
        <div class="sensor-value">
            <span id="co2Outdoor">--</span>
            <small>ppm</small>
        </div>
    </div>
</section>

<!-- ===== 中間圖表 ===== -->

<section class="center-panel">
    <div class="chart-card">
        <div class="chart-title">
            🌡️ 水溫變化
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-title">
            💧 濕度變化
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="humidityChart"></canvas>
        </div>
    </div>

    <div class="chart-card wide">
        <div class="chart-title">
            🌫️ 室內與室外 CO₂ 濃度比較
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="co2Chart"></canvas>
        </div>
    </div>
</section>

<!-- ===== 右側統計 ===== -->

<aside class="right-panel">
    <div class="panel-title">📊 數據統計</div>
    <div id="statRangeLabel">(最近 10 分鐘)</div>

    <div class="controls">
        <div>
            <span class="controls-label">📈 圖表筆數</span>
            <div class="btn-group" id="chartBtnGroup">
                <button class="active" onclick="changeChartCount(10)">10筆</button>
                <button onclick="changeChartCount(20)">20筆</button>
                <button onclick="changeChartCount(50)">50筆</button>
                <button onclick="changeChartCount(0)">全部</button>
            </div>
        </div>

        <div>
            <span class="controls-label">⏱ 統計時間</span>
            <div class="btn-group" id="statBtnGroup">
                <button class="active" onclick="changeStatRange(10)">10min</button>
                <button onclick="changeStatRange(30)">30min</button>
                <button onclick="changeStatRange(60)">60min</button>
            </div>
        </div>
    </div>

    <div id="statsContainer"></div>
</aside>

</main>

<footer>隊伍編號：大專-創-N075</footer>

</div>

<script>
"use strict";

// ===== ThingSpeak 設定 =====

const CHANNEL_ID = "3474112";
const READ_API_KEY = "IT0OTL4TT1QFKXO8";
const TIMEZONE = "Asia/Taipei";

const FIELD_MAP = {
    temperature: "field1",
    humidity: "field2",
    co2Indoor: "field4",
    co2Outdoor: "field5"
};

const $ = id => document.getElementById(id);

let chartCount = 10;
let statMinutes = 10;
let charts = {};
let loading = false;
let reloadPending = false;

// ===== 時間格式 =====

function formatTime(date, full = false) {
    const opts = {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    };

    if (full) {
        Object.assign(opts, {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        });
    }

    return new Intl.DateTimeFormat("zh-TW", opts).format(date);
}

// ===== 數值處理 =====

function parseValue(v) {
    if (
        v === null ||
        v === undefined ||
        String(v).trim() === ""
    ) {
        return null;
    }

    const n = Number(v);
    return Number.isFinite(n) ? n : null;
}

function setValue(id, v, d) {
    $(id).textContent = v === null ? "--" : v.toFixed(d);
}

function co2Color(v) {
    if (v === null) return "#0a7a6a";
    if (v >= 1500) return "#dc2626";
    if (v >= 1000) return "#f97316";
    return "#087f6f";
}

// ===== 連線狀態 =====

function setStatus(message, state) {
    $("status").textContent = message;

    const colors = {
        ok: "#8fffd5",
        loading: "#fce7a1",
        error: "#fbb5b5"
    };

    const color = colors[state] || colors.loading;

    $("status").style.color = color;
    $("statusDot").style.background = color;
    $("statusDot").style.boxShadow =
        `0 0 9px ${color}80`;
}

// ===== 圖表筆數切換 =====

window.changeChartCount = function(count) {
    chartCount = count;

    document.querySelectorAll(
        "#chartBtnGroup button"
    ).forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent.trim() ===
            (count === 0 ? "全部" : count + "筆")
        );
    });

    document.querySelectorAll(
        ".count-label"
    ).forEach(el => {
        el.textContent =
            count === 0 ? "全部" : count + "筆";
    });

    loadData();
};

// ===== 統計時間切換 =====

window.changeStatRange = function(minutes) {
    statMinutes = minutes;

    document.querySelectorAll(
        "#statBtnGroup button"
    ).forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent.trim() === minutes + "min"
        );
    });

    $("statRangeLabel").textContent =
        `(最近 ${minutes} 分鐘)`;

    loadData();
};

// ===== 建立圖表 =====

function createChart(id, datasets, start, end, unit) {
    if (charts[id]) {
        charts[id].destroy();
    }

    charts[id] = new Chart($(id), {
        type: "line",

        data: {
            datasets: datasets.map(item => ({
                label: item.label,
                data: item.data,
                borderColor: item.color,
                backgroundColor: item.color + "18",
                borderWidth: 2,
                pointRadius: 3,
                pointHoverRadius: 6,
                tension: 0.25,
                fill: false,
                spanGaps: false
            }))
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            animation: {
                duration: 250
            },

            interaction: {
                mode: "nearest",
                intersect: false
            },

            plugins: {
                legend: {
                    display: datasets.length > 1,
                    position: "top",
                    labels: {
                        usePointStyle: true,
                        boxWidth: 8,
                        font: { size: 11 },
                        padding: 8
                    }
                },

                tooltip: {
                    callbacks: {
                        title: items => items.length
                            ? formatTime(
                                new Date(items[0].parsed.x),
                                true
                            )
                            : "",

                        label: ctx =>
                            `${ctx.dataset.label}: ` +
                            `${ctx.parsed.y.toFixed(
                                unit === "ppm" ? 0 : 1
                            )} ${unit}`
                    }
                }
            },

            scales: {
                x: {
                    type: "linear",
                    min: start,
                    max: end,

                    ticks: {
                        maxTicksLimit: 6,
                        font: { size: 10 },
                        callback: value =>
                            formatTime(new Date(value))
                    },

                    grid: {
                        display: false
                    }
                },

                y: {
                    beginAtZero: false,

                    ticks: {
                        font: { size: 10 },
                        maxTicksLimit: 5
                    },

                    grid: {
                        color: "rgba(0,0,0,.05)"
                    }
                }
            }
        }
    });
}

// ===== 圖表資料 =====

function getPoints(feeds, field) {
    return feeds.flatMap(feed => {
        const value = parseValue(feed[field]);

        return value === null
            ? []
            : [{ x: feed.timestamp, y: value }];
    });
}

// ===== 統計計算 =====

function getStats(feeds, field) {
    const values = feeds
        .map(feed => parseValue(feed[field]))
        .filter(value => value !== null);

    if (!values.length) return null;

    return {
        max: Math.max(...values),
        min: Math.min(...values),
        avg: values.reduce(
            (a, b) => a + b, 0
        ) / values.length
    };
}

// ===== 顯示統計 =====

function renderStats(feeds) {
    const configs = [
        {
            name: "🌡️ 水溫",
            field: FIELD_MAP.temperature,
            unit: "°C",
            d: 1
        },
        {
            name: "💧 濕度",
            field: FIELD_MAP.humidity,
            unit: "%",
            d: 1
        },
        {
            name: "🏠 室內 CO₂",
            field: FIELD_MAP.co2Indoor,
            unit: "ppm",
            d: 0
        },
        {
            name: "🌳 室外 CO₂",
            field: FIELD_MAP.co2Outdoor,
            unit: "ppm",
            d: 0
        }
    ];

    $("statsContainer").innerHTML =
        configs.map(config => {
            const stats = getStats(feeds, config.field);

            const show = key => stats
                ? stats[key].toFixed(config.d) +
                  " " + config.unit
                : "--";

            return `
                <div class="stat-section">
                    <div class="stat-name">
                        ${config.name}
                    </div>

                    <div class="stat-row">
                        <span>最高</span>
                        <span class="stat-value">
                            ${show("max")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>最低</span>
                        <span class="stat-value">
                            ${show("min")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>平均</span>
                        <span class="stat-value">
                            ${show("avg")}
                        </span>
                    </div>
                </div>
            `;
        }).join("");
}

// ===== ThingSpeak API =====

function feedsURL() {
    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds.json?` +
        `api_key=${READ_API_KEY}&results=1000`
    );
}

function latestURL() {
    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds/last.json?` +
        `api_key=${READ_API_KEY}`
    );
}

// ===== 讀取資料 =====

async function loadData() {
    if (loading) {
        reloadPending = true;
        return;
    }

    loading = true;
    setStatus("讀取中...", "loading");

    try {
        const [fr, lr] = await Promise.all([
            fetch(feedsURL(), { cache: "no-store" }),
            fetch(latestURL(), { cache: "no-store" })
        ]);

        if (!fr.ok || !lr.ok) {
            throw Error("ThingSpeak HTTP 錯誤");
        }

        const history = await fr.json();
        const latest = await lr.json();

        if (!latest || !latest.created_at) {
            throw Error("找不到最新資料");
        }

        const latestTs =
            new Date(latest.created_at).getTime();

        if (!Number.isFinite(latestTs)) {
            throw Error("資料時間無效");
        }

        let allFeeds = (history.feeds || [])
            .map(feed => ({
                ...feed,
                timestamp:
                    new Date(feed.created_at).getTime()
            }))
            .filter(feed =>
                Number.isFinite(feed.timestamp)
            );

        const latestFeed = {
            ...latest,
            timestamp: latestTs
        };

        const index = allFeeds.findIndex(
            feed => feed.timestamp === latestTs
        );

        if (index >= 0) {
            allFeeds[index] = latestFeed;
        } else {
            allFeeds.push(latestFeed);
        }

        allFeeds.sort(
            (a, b) => a.timestamp - b.timestamp
        );

        // ===== 即時感測資料 =====

        const water = parseValue(
            latest[FIELD_MAP.temperature]
        );

        const humidity = parseValue(
            latest[FIELD_MAP.humidity]
        );

        const indoor = parseValue(
            latest[FIELD_MAP.co2Indoor]
        );

        const outdoor = parseValue(
            latest[FIELD_MAP.co2Outdoor]
        );

        setValue("temperature", water, 1);
        setValue("humidity", humidity, 1);
        setValue("co2Indoor", indoor, 0);
        setValue("co2Outdoor", outdoor, 0);

        $("co2Indoor").style.color = co2Color(indoor);
        $("co2Outdoor").style.color = co2Color(outdoor);

        $("updateTime").textContent =
            formatTime(new Date(latestTs), true);

        // ===== 圖表資料筆數 =====

        const feeds = chartCount === 0
            ? allFeeds
            : allFeeds.slice(-chartCount);

        if (!feeds.length) {
            throw Error("沒有圖表資料");
        }

        const first = feeds[0].timestamp;
        const last = feeds[feeds.length - 1].timestamp;

        const start = first === last
            ? first - 30000
            : first;

        const end = first === last
            ? last + 30000
            : last;

        // ===== 水溫圖表 =====

        createChart(
            "temperatureChart",
            [{
                label: "水溫",
                data: getPoints(
                    feeds,
                    FIELD_MAP.temperature
                ),
                color: "#e74c3c"
            }],
            start,
            end,
            "°C"
        );

        // ===== 濕度圖表 =====

        createChart(
            "humidityChart",
            [{
                label: "濕度",
                data: getPoints(
                    feeds,
                    FIELD_MAP.humidity
                ),
                color: "#3498db"
            }],
            start,
            end,
            "%"
        );

        // ===== 室內與室外 CO2 雙曲線 =====

        createChart(
            "co2Chart",
            [
                {
                    label: "室內 CO₂",
                    data: getPoints(
                        feeds,
                        FIELD_MAP.co2Indoor
                    ),
                    color: "#e76f51"
                },
                {
                    label: "室外 CO₂",
                    data: getPoints(
                        feeds,
                        FIELD_MAP.co2Outdoor
                    ),
                    color: "#3498db"
                }
            ],
            start,
            end,
            "ppm"
        );

        // ===== 數據統計 =====

        const statFeeds = allFeeds.filter(
            feed =>
                feed.timestamp >=
                    latestTs - statMinutes * 60000 &&
                feed.timestamp <= latestTs
        );

        renderStats(statFeeds);

        setStatus("資料連線正常", "ok");

    } catch (error) {
        console.error(error);
        setStatus("讀取失敗", "error");

    } finally {
        loading = false;

        if (reloadPending) {
            reloadPending = false;
            loadData();
        }
    }
}

// ===== 初始化 =====

loadData();

// 每 15 秒自動更新
setInterval(loadData, 15000);

</script>
</body>
</html>
