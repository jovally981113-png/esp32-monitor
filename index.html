
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧微藻遮陽換氣系統</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #0a7a6a;
    --dark: #065a4e;
    --light: #e8f6f2;
    --muted: #5f7f78;
    --shadow: 0 8px 24px rgba(0,70,60,0.10);
}

body {
    font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
    background: var(--light);
    color: #1a3d37;
}

.dashboard {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================================
   頂部標題列：縮小版本
========================================= */

header {
    background: linear-gradient(
        115deg,
        #064e46 0%,
        #08796b 55%,
        #0c8b79 100%
    );
    color: white;
    padding: 10px 28px;
    height: 94px;
    min-height: 94px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 2px solid #4dd4b4;
    box-shadow: 0 5px 18px rgba(0,75,65,0.14);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-icon {
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
}

header h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1.5px;
    line-height: 1.25;
}

header p {
    margin-top: 4px;
    color: #c4f0e5;
    font-size: 13px;
    letter-spacing: 0.5px;
}

/* 右側狀態卡片 */

.system-status {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 15px;
    padding: 7px 14px;
    min-width: 260px;
    backdrop-filter: blur(10px);
    flex-shrink: 0;
}

.status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 3px 0;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #7df0d0;
    box-shadow: 0 0 9px #7df0d080;
    flex-shrink: 0;
}

.status-label {
    color: #c4f0e5;
    white-space: nowrap;
}

#status {
    font-weight: 700;
    color: #8fffd5;
}

#updateTime {
    color: white;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

/* =========================================
   主畫面
========================================= */

main {
    flex: 1;
    display: grid;
    grid-template-columns: 21% minmax(0,1fr) 25%;
    gap: 16px;
    padding: 18px;
    min-height: 0;
}

.left-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.panel-title {
    color: var(--primary);
    font-size: 29px;
    font-weight: 800;
}

.sensor-card,
.chart-card,
.right-panel {
    background: white;
    border-radius: 20px;
    box-shadow: var(--shadow);
}

.sensor-card {
    flex: 1;
    min-height: 115px;
    border-left: 5px solid #1fb3a0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    transition: 0.25s;
}

.sensor-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0,70,60,0.15);
}

.sensor-icon {
    font-size: 32px;
}

.sensor-name {
    font-size: 20px;
    color: var(--muted);
    margin-top: 4px;
}

.sensor-value {
    color: var(--primary);
    font-size: 38px;
    font-weight: 800;
    margin-top: 4px;
}

.sensor-value small {
    font-size: 17px;
    font-weight: 400;
    color: #8ba9a3;
}

/* =========================================
   中間圖表
========================================= */

.center-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 16px;
    min-height: 520px;
}

.chart-card {
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: 0.25s;
}

.chart-card:hover {
    box-shadow: 0 12px 28px rgba(0,70,60,0.14);
}

.chart-card.wide {
    grid-column: span 2;
}

.chart-title {
    font-size: 25px;
    font-weight: 800;
    color: #1a4d44;
    margin-bottom: 12px;
}

.chart-title span {
    font-size: 13px;
    font-weight: normal;
    color: var(--muted);
    background: var(--light);
    padding: 4px 10px;
    border-radius: 20px;
    vertical-align: middle;
}

.chart-container {
    flex: 1;
    position: relative;
    min-height: 0;
}

/* =========================================
   右側統計
========================================= */

.right-panel {
    padding: 20px;
    overflow-y: auto;
}

#statRangeLabel {
    color: var(--muted);
    margin-top: 6px;
    font-size: 14px;
}

.controls {
    margin: 18px 0;
}

.controls-row {
    margin-bottom: 15px;
}

.controls-label {
    display: block;
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 8px;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.btn-group button {
    border: none;
    border-radius: 20px;
    background: #eaf5f2;
    color: #24564f;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

.btn-group button:hover {
    background: #d4e9e2;
}

.btn-group button.active {
    background: var(--primary);
    color: white;
}

.stat-section {
    border-top: 1px solid #e6f0ed;
    padding: 14px 0;
}

.stat-name {
    color: #24564f;
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 8px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 17px;
    color: #66837d;
    padding: 4px 0;
}

.stat-value {
    font-weight: 700;
    color: var(--primary);
    white-space: nowrap;
}

footer {
    text-align: center;
    padding: 10px;
    color: #8aa8a0;
    font-size: 12px;
}

/* =========================================
   響應式
========================================= */

@media(max-width:1200px) {
    header h1 {
        font-size: 26px;
    }

    main {
        grid-template-columns: 24% minmax(0,1fr);
    }

    .right-panel {
        grid-column: span 2;
    }
}

@media(max-width:760px) {
    header {
        flex-direction: column;
        align-items: stretch;
        padding: 14px 16px;
        height: auto;
        min-height: 94px;
    }

    .brand {
        gap: 10px;
    }

    .brand-icon {
        width: 42px;
        height: 42px;
        font-size: 25px;
    }

    header h1 {
        font-size: 22px;
    }

    header p {
        font-size: 12px;
    }

    .system-status {
        min-width: 0;
        width: 100%;
        padding: 8px 12px;
    }

    .status-row {
        font-size: 12px;
    }

    main {
        display: block;
    }

    .left-panel {
        margin-bottom: 16px;
    }

    .panel-title {
        font-size: 23px;
    }

    .sensor-card {
        min-height: 110px;
    }

    .center-panel {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
    }

    .chart-card {
        height: 280px;
        flex: none;
    }

    .chart-title {
        font-size: 20px;
    }
}
</style>
</head>

<body>
<div class="dashboard">

<!-- =====================================
     頂部標題
===================================== -->

<header>
    <div class="brand">
        <div class="brand-icon">🌿</div>
        <div>
            <h1>智慧微藻遮陽換氣系統</h1>
            <p>
                Smart Microalgae Shading
                · 即時環境監控平台
            </p>
        </div>
    </div>

    <div class="system-status">
        <div class="status-row">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label">系統狀態</span>
            <span id="status">連線中...</span>
        </div>

        <div class="status-row">
            <span>🕒</span>
            <span class="status-label">最後更新</span>
            <span id="updateTime">--</span>
        </div>
    </div>
</header>

<main>

<!-- =====================================
     左側即時數據
===================================== -->

<section class="left-panel">
    <div class="panel-title">📡 即時數據</div>

    <div class="sensor-card">
        <div class="sensor-icon">🌡️</div>
        <div class="sensor-name">水溫</div>
        <div class="sensor-value">
            <span id="temperature">--</span>
            <small>°C</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">💧</div>
        <div class="sensor-name">濕度</div>
        <div class="sensor-value">
            <span id="humidity">--</span>
            <small>%</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🏠</div>
        <div class="sensor-name">室內 CO₂</div>
        <div class="sensor-value">
            <span id="co2Indoor">--</span>
            <small>ppm</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🌳</div>
        <div class="sensor-name">室外 CO₂</div>
        <div class="sensor-value">
            <span id="co2Outdoor">--</span>
            <small>ppm</small>
        </div>
    </div>
</section>

<!-- =====================================
     中間圖表
===================================== -->

<section class="center-panel">

    <div class="chart-card">
        <div class="chart-title">
            🌡️ 水溫變化
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-title">
            💧 濕度變化
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="humidityChart"></canvas>
        </div>
    </div>

    <div class="chart-card wide">
        <div class="chart-title">
            🌫️ 室內與室外 CO₂ 濃度比較
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="co2Chart"></canvas>
        </div>
    </div>

</section>

<!-- =====================================
     右側統計
===================================== -->

<aside class="right-panel">

    <div class="panel-title">📊 數據統計</div>
    <div id="statRangeLabel">(最近 10 分鐘)</div>

    <div class="controls">

        <div class="controls-row">
            <span class="controls-label">📈 圖表筆數</span>

            <div class="btn-group" id="chartBtnGroup">
                <button class="active" onclick="changeChartCount(10)">
                    10筆
                </button>
                <button onclick="changeChartCount(20)">
                    20筆
                </button>
                <button onclick="changeChartCount(50)">
                    50筆
                </button>
                <button onclick="changeChartCount(0)">
                    全部
                </button>
            </div>
        </div>

        <div class="controls-row">
            <span class="controls-label">⏱ 統計時間</span>

            <div class="btn-group" id="statBtnGroup">
                <button class="active" onclick="changeStatRange(10)">
                    10min
                </button>
                <button onclick="changeStatRange(30)">
                    30min
                </button>
                <button onclick="changeStatRange(60)">
                    60min
                </button>
            </div>
        </div>

    </div>

    <div id="statsContainer"></div>

</aside>

</main>

<footer>
    隊伍編號：大專-創-N075
</footer>

</div>

<script>
"use strict";

// ==========================================
// ThingSpeak 設定
// ==========================================

const CHANNEL_ID = "3474112";
const READ_API_KEY = "IT0OTL4TT1QFKXO8";
const TIMEZONE = "Asia/Taipei";

// Field 1：水溫
// Field 2：濕度
// Field 3：停用
// Field 4：室內 CO2
// Field 5：室外 CO2

const FIELD_MAP = {
    temperature: "field1",
    humidity: "field2",
    co2Indoor: "field4",
    co2Outdoor: "field5"
};

let chartCount = 10;
let statMinutes = 10;
let charts = {};
let loading = false;
let reloadPending = false;

const $ = id => document.getElementById(id);

// ==========================================
// 台灣時間
// ==========================================

function formatTime(date, full = false) {
    const options = {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    };

    if (full) {
        options.year = "numeric";
        options.month = "2-digit";
        options.day = "2-digit";
    }

    return new Intl.DateTimeFormat(
        "zh-TW", options
    ).format(date);
}

// ==========================================
// 數值處理
// ==========================================

function parseValue(value) {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {
        return null;
    }

    const number = Number(value);
    return Number.isFinite(number) ? number : null;
}

function setValue(id, value, decimals) {
    $(id).textContent =
        value === null ? "--" : value.toFixed(decimals);
}

function co2Color(value) {
    if (value === null) return "#0a7a6a";
    if (value >= 1500) return "#dc2626";
    if (value >= 1000) return "#f97316";
    return "#087f6f";
}

// ==========================================
// 系統狀態
// ==========================================

function setStatus(message, state) {
    $("status").textContent = message;

    const colors = {
        ok: "#8fffd5",
        loading: "#fce7a1",
        error: "#fbb5b5"
    };

    const color = colors[state] || colors.loading;

    $("status").style.color = color;
    $("statusDot").style.background = color;
    $("statusDot").style.boxShadow =
        `0 0 12px ${color}80`;
}

// ==========================================
// 切換圖表筆數
// ==========================================

window.changeChartCount = function(count) {
    chartCount = count;

    document.querySelectorAll(
        "#chartBtnGroup button"
    ).forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent.trim() ===
            (count === 0 ? "全部" : count + "筆")
        );
    });

    document.querySelectorAll(
        ".count-label"
    ).forEach(element => {
        element.textContent =
            count === 0 ? "全部" : count + "筆";
    });

    loadData();
};

// ==========================================
// 切換統計時間
// ==========================================

window.changeStatRange = function(minutes) {
    statMinutes = minutes;

    document.querySelectorAll(
        "#statBtnGroup button"
    ).forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent.trim() === minutes + "min"
        );
    });

    $("statRangeLabel").textContent =
        `(最近 ${minutes} 分鐘)`;

    loadData();
};

// ==========================================
// 建立 Chart.js 圖表
// ==========================================

function createChart(id, datasets, start, end, unit) {
    if (charts[id]) {
        charts[id].destroy();
    }

    const chartDatasets = datasets.map(item => ({
        label: item.label,
        data: item.data,
        borderColor: item.color,
        backgroundColor: item.color + "18",
        borderWidth: 3,
        pointRadius: 4,
        pointHoverRadius: 7,
        pointBackgroundColor: item.color,
        pointBorderColor: item.color,
        tension: 0.25,
        fill: false,
        spanGaps: false
    }));

    charts[id] = new Chart($(id), {
        type: "line",

        data: {
            datasets: chartDatasets
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            animation: {
                duration: 300
            },

            interaction: {
                mode: "nearest",
                intersect: false
            },

            plugins: {
                legend: {
                    display: datasets.length > 1,
                    position: "top",
                    labels: {
                        usePointStyle: true,
                        font: {
                            size: 14
                        }
                    }
                },

                tooltip: {
                    backgroundColor: "rgba(0,0,0,0.78)",
                    padding: 12,
                    cornerRadius: 10,

                    callbacks: {
                        title: context => {
                            if (!context.length) return "";

                            return formatTime(
                                new Date(context[0].parsed.x),
                                true
                            );
                        },

                        label: context => {
                            const decimals =
                                unit === "ppm" ? 0 : 1;

                            return (
                                context.dataset.label + ": " +
                                context.parsed.y.toFixed(decimals) +
                                " " + unit
                            );
                        }
                    }
                }
            },

            scales: {
                x: {
                    type: "linear",
                    min: start,
                    max: end,

                    ticks: {
                        maxTicksLimit: 8,
                        callback: value =>
                            formatTime(new Date(value))
                    },

                    grid: {
                        display: false
                    }
                },

                y: {
                    beginAtZero: false,

                    ticks: {
                        font: {
                            size: 12
                        }
                    },

                    grid: {
                        color: "rgba(0,0,0,0.05)"
                    }
                }
            }
        }
    });
}

// ==========================================
// 取得圖表資料點
// ==========================================

function getPoints(feeds, field) {
    return feeds.flatMap(feed => {
        const value = parseValue(feed[field]);

        if (value === null) return [];

        return [{
            x: feed.timestamp,
            y: value
        }];
    });
}

// ==========================================
// 計算統計資料
// ==========================================

function getStats(feeds, field) {
    const values = feeds
        .map(feed => parseValue(feed[field]))
        .filter(value => value !== null);

    if (!values.length) {
        return null;
    }

    const sum = values.reduce(
        (total, value) => total + value, 0
    );

    return {
        max: Math.max(...values),
        min: Math.min(...values),
        avg: sum / values.length
    };
}

// ==========================================
// 顯示統計資料
// ==========================================

function renderStats(feeds) {
    const configs = [
        {
            name: "🌡️ 水溫",
            field: FIELD_MAP.temperature,
            unit: "°C",
            decimals: 1
        },
        {
            name: "💧 濕度",
            field: FIELD_MAP.humidity,
            unit: "%",
            decimals: 1
        },
        {
            name: "🏠 室內 CO₂",
            field: FIELD_MAP.co2Indoor,
            unit: "ppm",
            decimals: 0
        },
        {
            name: "🌳 室外 CO₂",
            field: FIELD_MAP.co2Outdoor,
            unit: "ppm",
            decimals: 0
        }
    ];

    $("statsContainer").innerHTML =
        configs.map(config => {
            const stats = getStats(feeds, config.field);

            function display(key) {
                if (!stats) return "--";

                return (
                    stats[key].toFixed(config.decimals) +
                    " " + config.unit
                );
            }

            return `
                <div class="stat-section">
                    <div class="stat-name">
                        ${config.name}
                    </div>

                    <div class="stat-row">
                        <span>最高</span>
                        <span class="stat-value">
                            ${display("max")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>最低</span>
                        <span class="stat-value">
                            ${display("min")}
                        </span>
                    </div>

                    <div class="stat-row">
                        <span>平均</span>
                        <span class="stat-value">
                            ${display("avg")}
                        </span>
                    </div>
                </div>
            `;
        }).join("");
}

// ==========================================
// ThingSpeak API
// ==========================================

function getFeedsURL() {
    return (
        "https://api.thingspeak.com/channels/" +
        CHANNEL_ID +
        "/feeds.json?api_key=" +
        READ_API_KEY +
        "&results=1000"
    );
}

function getLatestURL() {
    return (
        "https://api.thingspeak.com/channels/" +
        CHANNEL_ID +
        "/feeds/last.json?api_key=" +
        READ_API_KEY
    );
}

// ==========================================
// 讀取 ThingSpeak 資料
// ==========================================

async function loadData() {
    if (loading) {
        reloadPending = true;
        return;
    }

    loading = true;
    setStatus("讀取中...", "loading");

    try {
        // 同時取得歷史與最新資料
        const [feedsResponse, latestResponse] =
            await Promise.all([
                fetch(getFeedsURL(), {
                    cache: "no-store"
                }),

                fetch(getLatestURL(), {
                    cache: "no-store"
                })
            ]);

        if (
            !feedsResponse.ok ||
            !latestResponse.ok
        ) {
            throw new Error("ThingSpeak HTTP 錯誤");
        }

        const feedsJSON = await feedsResponse.json();
        const latest = await latestResponse.json();

        if (!latest || !latest.created_at) {
            throw new Error("找不到最新資料");
        }

        const latestTs =
            new Date(latest.created_at).getTime();

        if (!Number.isFinite(latestTs)) {
            throw new Error("最新資料時間無效");
        }

        // ==================================
        // 歷史資料
        // ==================================

        let allFeeds = (feedsJSON.feeds || [])
            .map(feed => ({
                ...feed,
                timestamp:
                    new Date(feed.created_at).getTime()
            }))
            .filter(feed =>
                Number.isFinite(feed.timestamp)
            );

        // 將最新資料放入歷史資料
        const latestFeed = {
            ...latest,
            timestamp: latestTs
        };

        const index = allFeeds.findIndex(
            feed => feed.timestamp === latestTs
        );

        if (index >= 0) {
            allFeeds[index] = latestFeed;
        } else {
            allFeeds.push(latestFeed);
        }

        // 舊資料到新資料
        allFeeds.sort(
            (a, b) => a.timestamp - b.timestamp
        );

        // ==================================
        // 即時感測資料
        // ==================================

        const waterTemp = parseValue(
            latest[FIELD_MAP.temperature]
        );

        const humidity = parseValue(
            latest[FIELD_MAP.humidity]
        );

        const indoorCO2 = parseValue(
            latest[FIELD_MAP.co2Indoor]
        );

        const outdoorCO2 = parseValue(
            latest[FIELD_MAP.co2Outdoor]
        );

        setValue("temperature", waterTemp, 1);
        setValue("humidity", humidity, 1);
        setValue("co2Indoor", indoorCO2, 0);
        setValue("co2Outdoor", outdoorCO2, 0);

        $("co2Indoor").style.color =
            co2Color(indoorCO2);

        $("co2Outdoor").style.color =
            co2Color(outdoorCO2);

        // 更新時間
        $("updateTime").textContent =
            formatTime(new Date(latestTs), true);

        // ==================================
        // 圖表顯示筆數
        // ==================================

        const chartFeeds = chartCount === 0
            ? allFeeds
            : allFeeds.slice(-chartCount);

        if (!chartFeeds.length) {
            throw new Error("沒有圖表資料");
        }

        const firstTs = chartFeeds[0].timestamp;

        const lastTs =
            chartFeeds[chartFeeds.length - 1].timestamp;

        // 避免只有一筆資料時 X 軸範圍為零
        const start = firstTs === lastTs
            ? firstTs - 30000
            : firstTs;

        const end = firstTs === lastTs
            ? lastTs + 30000
            : lastTs;

        // ==================================
        // 水溫圖表
        // ==================================

        createChart(
            "temperatureChart",
            [{
                label: "水溫",
                data: getPoints(
                    chartFeeds,
                    FIELD_MAP.temperature
                ),
                color: "#e74c3c"
            }],
            start,
            end,
            "°C"
        );

        // ==================================
        // 濕度圖表
        // ==================================

        createChart(
            "humidityChart",
            [{
                label: "濕度",
                data: getPoints(
                    chartFeeds,
                    FIELD_MAP.humidity
                ),
                color: "#3498db"
            }],
            start,
            end,
            "%"
        );

        // ==================================
        // CO2 室內、室外雙曲線
        // ==================================

        createChart(
            "co2Chart",
            [
                {
                    label: "室內 CO₂",
                    data: getPoints(
                        chartFeeds,
                        FIELD_MAP.co2Indoor
                    ),
                    color: "#e76f51"
                },
                {
                    label: "室外 CO₂",
                    data: getPoints(
                        chartFeeds,
                        FIELD_MAP.co2Outdoor
                    ),
                    color: "#3498db"
                }
            ],
            start,
            end,
            "ppm"
        );

        // ==================================
        // 統計時間範圍
        // ==================================

        const statStart =
            latestTs - statMinutes * 60 * 1000;

        const statFeeds = allFeeds.filter(
            feed =>
                feed.timestamp >= statStart &&
                feed.timestamp <= latestTs
        );

        renderStats(statFeeds);

        // ==================================
        // 成功
        // ==================================

        setStatus("資料連線正常", "ok");

    } catch (error) {
        console.error("ThingSpeak 錯誤:", error);

        setStatus("讀取失敗", "error");

    } finally {
        loading = false;

        // 若讀取期間切換設定，再讀取一次
        if (reloadPending) {
            reloadPending = false;
            loadData();
        }
    }
}

// ==========================================
// 系統初始化
// ==========================================

// 第一次讀取
loadData();

// 每 15 秒自動更新
setInterval(loadData, 15000);

</script>

</body>
</html>
