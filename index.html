
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧微藻遮陽換氣系統</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #0a7a6a;
    --dark: #065a4e;
    --light: #e8f6f2;
    --muted: #5f7f78;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    background: var(--light);
    color: #1a3d37;
}

.dashboard {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ==========================
   頂部
========================== */

header {
    background: linear-gradient(
        135deg,
        var(--dark),
        var(--primary)
    );
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 4px;
    font-size: 13px;
    color: #c4e8e0;
}

.system-status {
    background: #ffffff20;
    padding: 8px 15px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 13px;
    white-space: nowrap;
}

/* ==========================
   主畫面
   右側統計縮小為 18%
========================== */

main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns:
        minmax(155px, 18%)
        minmax(0, 1fr)
        minmax(175px, 18%);
    gap: 10px;
    padding: 10px;
}

/* ==========================
   左側即時數據
========================== */

.left-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
}

.panel-title {
    color: var(--primary);
    font-size: 19px;
    font-weight: bold;
    flex-shrink: 0;
}

.sensor-card {
    flex: 1;
    min-height: 0;
    background: white;
    border-radius: 13px;
    border-left: 4px solid #1fb3a0;
    box-shadow: 0 4px 15px #00463c12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5px;
}

.sensor-icon {
    font-size: clamp(16px, 2.5vh, 25px);
}

.sensor-name {
    font-size: 14px;
    color: var(--muted);
    margin: 2px 0;
}

.sensor-value {
    font-size: clamp(19px, 3.2vh, 31px);
    font-weight: bold;
    color: var(--primary);
    white-space: nowrap;
}

.sensor-value small {
    font-size: 12px;
    font-weight: normal;
    color: #8ba9a3;
}

/* ==========================
   中間圖表
========================== */

.center-panel {
    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);
    grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);
    gap: 10px;
    min-height: 0;
    min-width: 0;
}

.chart-card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px #00463c12;
    padding: 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    cursor: pointer;
    transition:
        box-shadow 0.2s,
        border-color 0.2s;
    border: 2px solid transparent;
}

.chart-card:hover {
    border-color: #1fb3a0;
    box-shadow: 0 6px 20px #00463c25;
}

.chart-card:focus-visible {
    outline: 3px solid #1fb3a0;
    outline-offset: 2px;
}

.chart-card.wide {
    grid-column: span 2;
    border-color: #b4e6da;
}

.chart-title {
    font-size: 16px;
    font-weight: bold;
    color: #1a4d44;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
}

.chart-title span {
    font-size: 11px;
    font-weight: normal;
    color: var(--muted);
    background: var(--light);
    padding: 3px 8px;
    border-radius: 12px;
}

.chart-container {
    flex: 1;
    position: relative;
    min-height: 0;
    min-width: 0;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

/* ==========================
   右側統計
========================== */

.right-panel {
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px #00463c12;
    padding: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}

#statRangeLabel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}

.controls {
    margin: 10px 0 5px;
    flex-shrink: 0;
}

.controls-row {
    margin-bottom: 9px;
}

.controls-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.btn-group button {
    border: 0;
    border-radius: 16px;
    background: #eaf5f2;
    color: #24564f;
    padding: 6px 9px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.btn-group button:hover {
    background: #ccebe3;
}

.btn-group button.active {
    background: var(--primary);
    color: white;
}

#statsContainer {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
}

.stat-section {
    border-top: 1px solid #e6f0ed;
    padding: 6px 0;
}

.stat-name {
    color: #24564f;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 3px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    font-size: 12px;
    color: #66837d;
    padding: 2px 0;
}

.stat-value {
    font-weight: bold;
    color: var(--primary);
    white-space: nowrap;
}

/* ==========================
   底部
========================== */

footer {
    text-align: center;
    padding: 5px;
    color: #8aa8a0;
    font-size: 11px;
    flex-shrink: 0;
}

/* ==========================
   螢幕高度調整
========================== */

@media (max-height: 720px) {
    header {
        padding: 8px 18px;
    }

    header h1 {
        font-size: 21px;
    }

    main {
        gap: 8px;
        padding: 8px;
    }

    .left-panel,
    .center-panel {
        gap: 7px;
    }

    .chart-card {
        padding: 8px;
    }

    .chart-title {
        font-size: 14px;
        margin-bottom: 3px;
    }

    .sensor-name {
        font-size: 12px;
    }

    .stat-section {
        padding: 3px 0;
    }

    .stat-row {
        padding: 1px 0;
    }
}

/* ==========================
   小螢幕排版
========================== */

@media (max-width: 1000px) {
    .dashboard {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
    }

    main {
        grid-template-columns:
            210px minmax(0, 1fr);
    }

    .right-panel {
        grid-column: span 2;
    }

    .center-panel {
        min-height: 500px;
    }

    .sensor-card {
        min-height: 85px;
    }
}

@media (max-width: 650px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    main {
        display: flex;
        flex-direction: column;
    }

    .left-panel {
        display: grid;
        grid-template-columns:
            repeat(2, 1fr);
    }

    .left-panel .panel-title {
        grid-column: span 2;
    }

    .sensor-card {
        min-height: 100px;
    }

    .center-panel {
        min-height: 550px;
    }

    .chart-card {
        padding: 8px;
    }

    .chart-title {
        font-size: 13px;
    }

    .right-panel {
        overflow: visible;
    }
}
</style>
</head>

<body>

<div class="dashboard">

<header>
    <div>
        <h1>🌿 智慧微藻遮陽換氣系統</h1>
        <p>
            Smart Microalgae Shading · 即時環境監控
        </p>
    </div>

    <div class="system-status">
        🟢 狀態：
        <span id="status">連線中...</span>
        <div>
            🕒 更新：
            <span id="updateTime">--</span>
        </div>
    </div>
</header>

<main>

<!-- 左側即時數據 -->

<section class="left-panel">

    <div class="panel-title">
        📡 即時數據
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🌡️</div>
        <div class="sensor-name">水溫</div>
        <div class="sensor-value">
            <span id="temperature">--</span>
            <small>°C</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">💧</div>
        <div class="sensor-name">濕度</div>
        <div class="sensor-value">
            <span id="humidity">--</span>
            <small>%</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🏠</div>
        <div class="sensor-name">室內 CO₂</div>
        <div class="sensor-value">
            <span id="co2Indoor">--</span>
            <small>ppm</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">🌳</div>
        <div class="sensor-name">室外 CO₂</div>
        <div class="sensor-value">
            <span id="co2Outdoor">--</span>
            <small>ppm</small>
        </div>
    </div>

    <div class="sensor-card">
        <div class="sensor-icon">⚡</div>
        <div class="sensor-name">電壓</div>
        <div class="sensor-value">
            <span id="voltage">--</span>
            <small>V</small>
        </div>
    </div>

</section>

<!-- 中間圖表 -->

<section class="center-panel" id="chartGrid">

    <div
        class="chart-card"
        id="temperatureCard"
        data-chart="temperature"
        role="button"
        tabindex="0"
        aria-label="將水溫圖表切換為大圖"
    >
        <div class="chart-title">
            🌡️ 水溫
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
    </div>

    <div
        class="chart-card"
        id="humidityCard"
        data-chart="humidity"
        role="button"
        tabindex="0"
        aria-label="將濕度圖表切換為大圖"
    >
        <div class="chart-title">
            💧 濕度
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="humidityChart"></canvas>
        </div>
    </div>

    <div
        class="chart-card wide"
        id="co2Card"
        data-chart="co2"
        role="button"
        tabindex="0"
        aria-label="將 CO2 圖表切換為大圖"
    >
        <div class="chart-title">
            🌫️ 室內與室外 CO₂ 濃度比較
            <span class="count-label">10筆</span>
        </div>
        <div class="chart-container">
            <canvas id="co2Chart"></canvas>
        </div>
    </div>

</section>

<!-- 右側統計 -->

<aside class="right-panel">

    <div class="panel-title">
        📊 數據統計
    </div>

    <div id="statRangeLabel">
        (最近 10 分鐘)
    </div>

    <div class="controls">

        <div class="controls-row">
            <span class="controls-label">
                📈 圖表筆數
            </span>
            <div class="btn-group" id="chartBtnGroup">
                <button class="active"
                    onclick="changeChartCount(10)">10筆</button>
                <button
                    onclick="changeChartCount(20)">20筆</button>
                <button
                    onclick="changeChartCount(50)">50筆</button>
                <button
                    onclick="changeChartCount(0)">全部</button>
            </div>
        </div>

        <div class="controls-row">
            <span class="controls-label">
                ⏱ 統計時間
            </span>
            <div class="btn-group" id="statBtnGroup">
                <button class="active"
                    onclick="changeStatRange(10)">10min</button>
                <button
                    onclick="changeStatRange(30)">30min</button>
                <button
                    onclick="changeStatRange(60)">60min</button>
            </div>
        </div>

    </div>

    <div id="statsContainer"></div>

</aside>

</main>

<footer>
    隊伍編號:大專-創-N075
</footer>

</div>

<script>
"use strict";

// ==========================================
// ThingSpeak 設定
// ==========================================

const CHANNEL_ID = "3474112";
const READ_API_KEY = "IT0OTL4TT1QFKXO8";
const TIMEZONE = "Asia/Taipei";

// Field 1：水溫
// Field 2：濕度
// Field 3：停用
// Field 4：室內 CO2
// Field 5：室外 CO2
// Field 6：電壓

const FIELD_MAP = {
    temperature: "field1",
    humidity: "field2",
    co2Indoor: "field4",
    co2Outdoor: "field5",
    voltage: "field6"
};

let chartCount = 10;
let statMinutes = 10;
let charts = {};
let loading = false;

let allFeedsCache = [];
let latestFeedCache = null;

let chartOrder = [
    "temperature",
    "humidity",
    "co2"
];

let largeChart = "co2";

const $ = id => document.getElementById(id);

// ==========================================
// 時間格式
// ==========================================

function formatTime(date, full = false) {
    const options = {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    };

    if (full) {
        options.year = "numeric";
        options.month = "2-digit";
        options.day = "2-digit";
    }

    return new Intl.DateTimeFormat(
        "zh-TW",
        options
    ).format(date);
}

// ==========================================
// 數值處理
// ==========================================

function parseValue(value) {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : null;
}

function setValue(id, value, decimals) {
    $(id).textContent =
        value === null
            ? "--"
            : value.toFixed(decimals);
}

function co2Color(value) {
    if (value === null) return "#0a7a6a";
    if (value >= 1500) return "#dc2626";
    if (value >= 1000) return "#f97316";
    return "#087f6f";
}

// ==========================================
// 點擊圖表交換位置與大小
// ==========================================

function swapChart(clickedChart) {
    if (clickedChart === largeChart) {
        return;
    }

    const clickedIndex =
        chartOrder.indexOf(clickedChart);

    const largeIndex =
        chartOrder.indexOf(largeChart);

    if (
        clickedIndex === -1 ||
        largeIndex === -1
    ) {
        return;
    }

    [
        chartOrder[clickedIndex],
        chartOrder[largeIndex]
    ] = [
        chartOrder[largeIndex],
        chartOrder[clickedIndex]
    ];

    largeChart = clickedChart;

    updateChartLayout();
}

// ==========================================
// 更新圖表排列
// ==========================================

function updateChartLayout() {
    const grid = $("chartGrid");

    const cardMap = {
        temperature: $("temperatureCard"),
        humidity: $("humidityCard"),
        co2: $("co2Card")
    };

    Object.values(cardMap).forEach(card => {
        card.classList.remove("wide");
    });

    chartOrder.forEach(name => {
        grid.appendChild(cardMap[name]);
    });

    cardMap[largeChart].classList.add("wide");

    Object.entries(cardMap).forEach(([name, card]) => {
        card.setAttribute(
            "aria-label",
            name === largeChart
                ? "目前為大圖"
                : "點擊將此圖表切換為大圖"
        );
    });

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            Object.values(charts).forEach(chart => {
                if (chart) {
                    chart.resize();
                    chart.update("none");
                }
            });
        });
    });
}

// ==========================================
// 圖表點擊事件
// ==========================================

function initializeChartClicks() {
    document.querySelectorAll(
        ".chart-card"
    ).forEach(card => {

        card.addEventListener("click", () => {
            swapChart(card.dataset.chart);
        });

        card.addEventListener("keydown", event => {
            if (
                event.key === "Enter" ||
                event.key === " "
            ) {
                event.preventDefault();
                swapChart(card.dataset.chart);
            }
        });
    });
}

// ==========================================
// 切換圖表筆數
// ==========================================

window.changeChartCount = function(count) {
    chartCount = count;

    document.querySelectorAll(
        "#chartBtnGroup button"
    ).forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent ===
            (count === 0 ? "全部" : count + "筆")
        );
    });

    document.querySelectorAll(
        ".count-label"
    ).forEach(element => {
        element.textContent =
            count === 0 ? "全部" : count + "筆";
    });

    renderDashboard();
};

// ==========================================
// 切換統計時間
// ==========================================

window.changeStatRange = function(minutes) {
    statMinutes = minutes;

    document.querySelectorAll(
        "#statBtnGroup button"
    ).forEach(button => {
        button.classList.toggle(
            "active",
            button.textContent === minutes + "min"
        );
    });

    $("statRangeLabel").textContent =
        `(最近 ${minutes} 分鐘)`;

    renderDashboard();
};

// ==========================================
// 建立圖表
// ==========================================

function createChart(id, datasets, start, end, unit) {
    if (charts[id]) {
        charts[id].destroy();
    }

    const chartDatasets = datasets.map(item => ({
        label: item.label,
        data: item.data,
        borderColor: item.color,
        backgroundColor: item.color + "18",
        borderWidth: 2.5,
        pointRadius: 3,
        pointHoverRadius: 6,
        pointBackgroundColor: item.color,
        tension: 0.25,
        fill: false,
        spanGaps: false
    }));

    charts[id] = new Chart($(id), {
        type: "line",
        data: {
            datasets: chartDatasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 250
            },
            interaction: {
                mode: "nearest",
                intersect: false
            },
            plugins: {
                legend: {
                    display: datasets.length > 1,
                    position: "top",
                    labels: {
                        usePointStyle: true,
                        boxWidth: 9,
                        font: {
                            size: 11
                        }
                    }
                },
                tooltip: {
                    callbacks: {
                        title: context => {
                            if (!context.length) return "";
                            return formatTime(
                                new Date(context[0].parsed.x),
                                true
                            );
                        },
                        label: context => {
                            const decimals =
                                unit === "ppm" ? 0 : 1;

                            return (
                                context.dataset.label + ": " +
                                context.parsed.y.toFixed(decimals) +
                                " " + unit
                            );
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: "linear",
                    min: start,
                    max: end,
                    ticks: {
                        maxTicksLimit: 6,
                        font: {
                            size: 10
                        },
                        callback: value =>
                            formatTime(new Date(value))
                    },
                    grid: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: false,
                    ticks: {
                        font: {
                            size: 10
                        }
                    },
                    grid: {
                        color: "rgba(0,0,0,0.05)"
                    }
                }
            }
        }
    });
}

// ==========================================
// 感測資料點
// ==========================================

function getPoints(feeds, field) {
    return feeds.flatMap(feed => {
        const value = parseValue(feed[field]);

        if (value === null) return [];

        return [{
            x: feed.timestamp,
            y: value
        }];
    });
}

// ==========================================
// 統計
// ==========================================

function getStats(feeds, field) {
    const values = feeds
        .map(feed => parseValue(feed[field]))
        .filter(value => value !== null);

    if (!values.length) return null;

    const sum = values.reduce(
        (total, value) => total + value,
        0
    );

    return {
        max: Math.max(...values),
        min: Math.min(...values),
        avg: sum / values.length
    };
}

function renderStats(feeds) {
    const configs = [
        {
            name: "🌡️ 水溫",
            field: FIELD_MAP.temperature,
            unit: "°C",
            decimals: 1
        },
        {
            name: "💧 濕度",
            field: FIELD_MAP.humidity,
            unit: "%",
            decimals: 1
        },
        {
            name: "🏠 室內 CO₂",
            field: FIELD_MAP.co2Indoor,
            unit: "ppm",
            decimals: 0
        },
        {
            name: "🌳 室外 CO₂",
            field: FIELD_MAP.co2Outdoor,
            unit: "ppm",
            decimals: 0
        },
        {
            name: "⚡ 電壓",
            field: FIELD_MAP.voltage,
            unit: "V",
            decimals: 2
        }
    ];

    $("statsContainer").innerHTML =
        configs.map(config => {
            const stats = getStats(
                feeds,
                config.field
            );

            function display(key) {
                if (!stats) return "--";

                return (
                    stats[key].toFixed(config.decimals) +
                    " " + config.unit
                );
            }

            return `
                <div class="stat-section">
                    <div class="stat-name">
                        ${config.name}
                    </div>
                    <div class="stat-row">
                        <span>最高</span>
                        <span class="stat-value">
                            ${display("max")}
                        </span>
                    </div>
                    <div class="stat-row">
                        <span>最低</span>
                        <span class="stat-value">
                            ${display("min")}
                        </span>
                    </div>
                    <div class="stat-row">
                        <span>平均</span>
                        <span class="stat-value">
                            ${display("avg")}
                        </span>
                    </div>
                </div>
            `;
        }).join("");
}

// ==========================================
// ThingSpeak API
// ==========================================

function getFeedsURL() {
    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds.json?` +
        `api_key=${READ_API_KEY}&results=1000`
    );
}

function getLatestURL() {
    return (
        `https://api.thingspeak.com/channels/` +
        `${CHANNEL_ID}/feeds/last.json?` +
        `api_key=${READ_API_KEY}`
    );
}

// ==========================================
// 即時數據
// ==========================================

function renderLatestData(latest) {
    if (!latest) return;

    const waterTemp = parseValue(
        latest[FIELD_MAP.temperature]
    );

    const humidity = parseValue(
        latest[FIELD_MAP.humidity]
    );

    const indoorCO2 = parseValue(
        latest[FIELD_MAP.co2Indoor]
    );

    const outdoorCO2 = parseValue(
        latest[FIELD_MAP.co2Outdoor]
    );

    const voltage = parseValue(
        latest[FIELD_MAP.voltage]
    );

    setValue("temperature", waterTemp, 1);
    setValue("humidity", humidity, 1);
    setValue("co2Indoor", indoorCO2, 0);
    setValue("co2Outdoor", outdoorCO2, 0);
    setValue("voltage", voltage, 2);

    $("co2Indoor").style.color =
        co2Color(indoorCO2);

    $("co2Outdoor").style.color =
        co2Color(outdoorCO2);

    $("updateTime").textContent =
        formatTime(
            new Date(latest.timestamp),
            true
        );
}

// ==========================================
// 更新監控畫面
// ==========================================

function renderDashboard() {
    if (
        !latestFeedCache ||
        !allFeedsCache.length
    ) {
        return;
    }

    const allFeeds = allFeedsCache;
    const latest = latestFeedCache;

    renderLatestData(latest);

    const chartFeeds = chartCount === 0
        ? allFeeds
        : allFeeds.slice(-chartCount);

    if (!chartFeeds.length) return;

    const firstTs = chartFeeds[0].timestamp;
    const lastTs =
        chartFeeds[chartFeeds.length - 1].timestamp;

    const start = firstTs === lastTs
        ? firstTs - 30000
        : firstTs;

    const end = firstTs === lastTs
        ? lastTs + 30000
        : lastTs;

    // 水溫圖表
    createChart(
        "temperatureChart",
        [{
            label: "水溫",
            data: getPoints(
                chartFeeds,
                FIELD_MAP.temperature
            ),
            color: "#e74c3c"
        }],
        start,
        end,
        "°C"
    );

    // 濕度圖表
    createChart(
        "humidityChart",
        [{
            label: "濕度",
            data: getPoints(
                chartFeeds,
                FIELD_MAP.humidity
            ),
            color: "#3498db"
        }],
        start,
        end,
        "%"
    );

    // 室內與室外 CO2 雙曲線
    createChart(
        "co2Chart",
        [
            {
                label: "室內 CO₂",
                data: getPoints(
                    chartFeeds,
                    FIELD_MAP.co2Indoor
                ),
                color: "#e76f51"
            },
            {
                label: "室外 CO₂",
                data: getPoints(
                    chartFeeds,
                    FIELD_MAP.co2Outdoor
                ),
                color: "#3498db"
            }
        ],
        start,
        end,
        "ppm"
    );

    // 統計時間
    const latestTs = latest.timestamp;

    const statStart =
        latestTs - statMinutes * 60 * 1000;

    const statFeeds = allFeeds.filter(
        feed =>
            feed.timestamp >= statStart &&
            feed.timestamp <= latestTs
    );

    renderStats(statFeeds);

    requestAnimationFrame(() => {
        Object.values(charts).forEach(chart => {
            if (chart) chart.resize();
        });
    });
}

// ==========================================
// 讀取 ThingSpeak
// ==========================================

async function loadData() {
    if (loading) return;

    loading = true;

    $("status").textContent = "讀取中...";
    $("status").style.color = "#ffffff";

    try {
        const [feedsResponse, latestResponse] =
            await Promise.all([
                fetch(getFeedsURL(), {
                    cache: "no-store"
                }),
                fetch(getLatestURL(), {
                    cache: "no-store"
                })
            ]);

        if (
            !feedsResponse.ok ||
            !latestResponse.ok
        ) {
            throw new Error(
                "ThingSpeak HTTP 錯誤"
            );
        }

        const feedsJSON =
            await feedsResponse.json();

        const latest =
            await latestResponse.json();

        if (!latest || !latest.created_at) {
            throw new Error(
                "找不到最新資料"
            );
        }

        const latestTs =
            new Date(latest.created_at).getTime();

        if (!Number.isFinite(latestTs)) {
            throw new Error(
                "最新資料時間無效"
            );
        }

        let allFeeds = (feedsJSON.feeds || [])
            .map(feed => ({
                ...feed,
                timestamp:
                    new Date(feed.created_at).getTime()
            }))
            .filter(feed =>
                Number.isFinite(feed.timestamp)
            );

        const latestFeed = {
            ...latest,
            timestamp: latestTs
        };

        const index = allFeeds.findIndex(
            feed => feed.timestamp === latestTs
        );

        if (index >= 0) {
            allFeeds[index] = {
                ...allFeeds[index],
                ...latestFeed
            };
        } else {
            allFeeds.push(latestFeed);
        }

        allFeeds.sort(
            (a, b) => a.timestamp - b.timestamp
        );

        allFeedsCache = allFeeds;
        latestFeedCache = latestFeed;

        renderDashboard();

        $("status").textContent =
            "資料連線正常";

        $("status").style.color =
            "#7df0d0";

    } catch (error) {
        console.error(
            "ThingSpeak 錯誤:",
            error
        );

        $("status").textContent =
            "讀取失敗";

        $("status").style.color =
            "#fbb5b5";

    } finally {
        loading = false;
    }
}

// ==========================================
// 初始化
// ==========================================

initializeChartClicks();
updateChartLayout();
loadData();

// 每 15 秒更新一次
setInterval(loadData, 15000);

// 視窗尺寸變更時調整圖表
window.addEventListener("resize", () => {
    Object.values(charts).forEach(chart => {
        if (chart) chart.resize();
    });
});

</script>
